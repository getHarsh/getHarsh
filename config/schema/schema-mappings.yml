# =============================================================================
# HOW TO USE THIS DICTIONARY
# =============================================================================
# 1. Build system reads this file at build time
# 2. When processing configs with enum values, it looks up mappings here
# 3. Automatically generates Schema.org JSON-LD without manual configuration
# 4. Validates that only valid enum values are used
#
# Example:
# Config: content_type: CONTENT_TYPE_TUTORIAL
# Lookup: content_types[CONTENT_TYPE_TUTORIAL] = "HowToArticle"
# Output: { "@type": "HowToArticle", ... }
# =============================================================================