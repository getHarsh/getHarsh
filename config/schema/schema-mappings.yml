# =============================================================================
# SCHEMA.ORG MAPPING DICTIONARY
# =============================================================================
# This file contains ALL enum-to-Schema.org mappings for the ecosystem.
# It is the single source of truth for automatic Schema.org generation.
#
# How it works:
# 1. Config files use enums (e.g., content_type: CONTENT_TYPE_TUTORIAL)
# 2. Build system reads this dictionary
# 3. Automatically maps to Schema.org (e.g., "HowToArticle")
# 4. Generates proper JSON-LD structured data
#
# This ensures "safe by default" - configs can only use valid enums,
# and Schema.org mapping is automatic and consistent.
# =============================================================================

