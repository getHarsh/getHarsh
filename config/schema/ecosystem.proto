// Cookie consent configuration for GDPR/ePrivacy compliance
// LEGALLY REQUIRED: EU law mandates explicit consent BEFORE loading analytics
// Reference: €1.34M fine example for non-compliance
message ConsentSettings {
  // Enable cookie consent banner
  bool enable_consent_banner = 1;
  
  // Cookie name for storing consent state
  string consent_cookie_name = 2;  // default: "analytics_consent"
  
  // How long consent is valid (in days)
  int32 consent_duration_days = 3; // default: 365
  
  // Enable Google Consent Mode v2 (required by March 2024)
  bool google_consent_mode_v2 = 4;
  
  // Text for the consent banner
  string banner_text = 5;
  
  // Text for the accept button
  string accept_button_text = 6;
  
  // Text for the decline button
  string decline_button_text = 7;
  
  // Link to privacy policy
  string privacy_policy_url = 8;
  
  // Link to cookie policy
  string cookie_policy_url = 9;
  
  // Google Consent Mode v2 specific configuration
  ConsentModeV2 consent_mode_v2 = 10;
  
  // Enable cross-domain consent sharing
  bool enable_cross_domain_consent = 11;
  
  // Domains to share consent across
  repeated string consent_domains = 12;
  
  // Consent UI position ("bottom", "top", "center")
  string banner_position = 13;
  
  // Banner theme ("light", "dark", "auto")
  string banner_theme = 14;
  
  // Consent categories configuration
  ConsentCategories consent_categories = 15;
  
  // Entity-specific consent settings
  map<string, EntityConsentSettings> entity_specific = 16;
  
  // Settings button text
  string settings_button_text = 17;
  
  // Save preferences button text
  string save_preferences_text = 18;
  
  // Consent version (for updates)
  string consent_version = 19;
  
  // Show consent status icon
  bool show_consent_icon = 20;
  
  // Regional consent defaults
  // See: CONSENT-ARCHITECTURE.md#regional-detection
  // Format: ["EU:denied", "US-CA:denied", "IN:granted", "DEFAULT:granted"]
  repeated string region_defaults = 21;
  
  // Enable granular category control
  // See: CONSENT-ARCHITECTURE.md#granular-consent-ui
  bool enable_granular_control = 22;
  
  // Category configuration for granular consent
