  // Example: "Artificial Intelligence, Distributed Systems, Philosophy of Mind"
  string knows_about = 11;
  
  // Educational affiliations using key references
  repeated PersonAffiliation alumni_of = 12;
}

// Flexible entity-to-entity relationship definition
// Supports relationships between any entities in the ecosystem
message EntityRelationship {
  // Source entity key (e.g., "harsh", "RTEPL", "HENA")
  string from_key = 1;
  
  // Source entity type (type-safe enum)
  EntityType from_type = 2;
  
  // Target entity key (e.g., "AION", "getHarsh", "JARVIS-kernel")
  string to_key = 3;
  
  // Target entity type (type-safe enum)
  EntityType to_type = 4;
  
  // Relationship type (type-safe enum)
  RelationshipType type = 5;
  
  // Optional description of the relationship
  string description = 6;
  
  // Start date (ISO 8601 format, e.g., "2024-01-01")
  string start_date = 7;
  
  // End date (ISO 8601 format, omit if current)
  string end_date = 8;
  
  // Whether this relationship is currently active
  bool is_current = 9;
  
  // Additional metadata as key-value pairs
  // Examples: support_type="infrastructure", evolution_stage="pivot"
  map<string, string> metadata = 10;
  
  // Optional role description (e.g., "Founding Product Manager")
  string role = 11;
  
  // Schema.org predicate for this relationship
  // Populated from RelationshipTypeMappings at build time
  // Examples: "founder", "owns", "memberOf", "worksFor"
  string schema_predicate = 12;
}

