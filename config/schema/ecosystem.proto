  string privacy_policy_url = 1;
  
  // Terms of service URL
  string terms_of_service_url = 2;
  
  // Cookie policy URL
  string cookie_policy_url = 3;
  
  // Terms of use URL
  string terms_of_use_url = 4;
  
  // Acceptable use policy URL
  string acceptable_use_policy_url = 5;
  
  // Data processing agreement URL
  string data_processing_agreement_url = 6;
  
  // Refund policy URL
  string refund_policy_url = 7;
  
  // Disclaimer URL
  string disclaimer_url = 8;
  
  // Additional policy links
  map<string, string> additional_policies = 9;
}

// =============================================================================
// SCHEMA.ORG CONFIGURATION
// =============================================================================
// Enables rich semantic markup for search engines and AI systems.
// See ../SCHEMA-ORG-EXAMPLES.md for complete implementation guide.
//
// Key Concepts:
// - Entity types: Person, Organization, ResearchProject, etc.
// - Relationships: owns, ownedBy, founder, hasPart, isPartOf
// - Page schemas: ContactPage, CollectionPage, BlogPosting, etc.
// - Inheritance: ecosystem → domain → blog/project
// =============================================================================

// Schema.org entity types for proper structured data
// Note: We use strings for flexibility (816+ types in Schema.org)
// This enum is for reference only - actual configs use string values
enum SchemaOrgType {
  // Default/unspecified
  SCHEMA_ORG_TYPE_UNSPECIFIED = 0;
  
  // Person types
  SCHEMA_ORG_TYPE_PERSON = 1;
  
  // Organization types
  SCHEMA_ORG_TYPE_ORGANIZATION = 2;
  SCHEMA_ORG_TYPE_CORPORATION = 3;
  SCHEMA_ORG_TYPE_LOCAL_BUSINESS = 4;
  SCHEMA_ORG_TYPE_EDUCATIONAL_ORGANIZATION = 5;
  
  // Creative work types
  SCHEMA_ORG_TYPE_CREATIVE_WORK = 10;
  SCHEMA_ORG_TYPE_RESEARCH_PROJECT = 11;
  SCHEMA_ORG_TYPE_WEB_SITE = 12;
  SCHEMA_ORG_TYPE_WEB_PAGE = 13;
  SCHEMA_ORG_TYPE_BLOG = 14;
  SCHEMA_ORG_TYPE_ARTICLE = 15;
  SCHEMA_ORG_TYPE_VISUAL_ARTWORK = 16;
  
  // Software types
  SCHEMA_ORG_TYPE_SOFTWARE_APPLICATION = 20;
  SCHEMA_ORG_TYPE_WEB_APPLICATION = 21;
  SCHEMA_ORG_TYPE_MOBILE_APPLICATION = 22;
  SCHEMA_ORG_TYPE_VIDEO_GAME = 23;
  
  // Service types
  SCHEMA_ORG_TYPE_SERVICE = 30;
  SCHEMA_ORG_TYPE_PROFESSIONAL_SERVICE = 31;
  
  // Product types
  SCHEMA_ORG_TYPE_PRODUCT = 40;
  SCHEMA_ORG_TYPE_BRAND = 41;
  
  // Event types
  SCHEMA_ORG_TYPE_EVENT = 50;
  SCHEMA_ORG_TYPE_COURSE = 51;
}

// Schema.org entity configuration
// Used to define the semantic type of any entity (domain, blog, project, page)
// See ../SCHEMA-ORG-EXAMPLES.md#configuration-examples for usage
message SchemaOrgEntity {
  // Primary Schema.org type using enum for common types
  // Use this for standard types (Person, Organization, etc.)
  SchemaOrgEntityType type_enum = 1;
  
  // Custom type string for types not in our enum
  // Use this for rare/specialized types (e.g., "MedicalOrganization")
  string custom_type = 2;
  
  // Additional types for multi-type entities
  // Example: ["WebSite", "Brand"] for getHarsh.in
  // See ../SCHEMA-ORG-EXAMPLES.md#quick-start for patterns
  repeated string additional_types = 3;
  
  // Simple string properties (name, description, url, etc.)
  map<string, string> custom_properties = 4;
  
  // Affiliations (for Person type)
  repeated SchemaOrgAffiliation affiliations = 5;
  
  // Parent entity reference (for hierarchy)
  string parent_entity_id = 6;  // e.g., "@id" reference
  
  // Relationship type to parent
  string parent_relationship = 7;  // e.g., "parentOrganization", "creator", "owns"
  
  // Child entities (for org -> projects)
  repeated SchemaOrgChild children = 8;
}

// Child entity reference for Schema.org
message SchemaOrgChild {
  // Child entity ID/URL
  string id = 1;
  
  // Relationship type
  string relationship = 2;  // e.g., "owns", "subOrganization", "hasPart"
  
  // Child type
  string type = 3;  // e.g., "ResearchProject", "SoftwareApplication"
}

// Affiliation for Person type in Schema.org JSON-LD output
// DEPRECATED: Use PersonAffiliation for configuration, this is for output only
message SchemaOrgAffiliation {
  // Organization name
  string name = 1;
  
  // Role or position
  string role = 2;
  
  // Organization URL (optional)
  string url = 3;
  
  // Start date (optional, ISO 8601 format)
  string start_date = 4;
  
  // End date (optional, ISO 8601 format, omit if current)
  string end_date = 5;
  
  // Organization type (optional, e.g., "Corporation", "EducationalOrganization")
  string organization_type = 6;
  
  // Affiliation type using enum for type safety
  AffiliationType affiliation_type = 7;
  
  // Organization @id reference (for linking to existing entities)
  // Example: "https://rawthoughts.in/#organization"
  string organization_id = 8;
  
  // Whether this is the primary/current affiliation
  bool is_primary = 9;
}

// Legal entity definition for the ecosystem catalog
message LegalEntity {
  // Short identifier (e.g., "RTEPL", "DSPL")
  string key = 1;
  
  // Full legal name
  string full_name = 2;
  
  // Entity type (e.g., "Private Limited Company", "LLC")
  string entity_type = 3;
  
  // Registration number
  string registration_number = 4;
  
  // Incorporation date
  string incorporation_date = 5;
  
  // Jurisdiction/Country
  string jurisdiction = 6;
  
  // Registered office address
  RegisteredAddress registered_address = 7;
  
  // Official contact information
  EntityContacts contacts = 8;
  
  // Founders and their roles
  repeated EntityPerson founders = 9;
  
  // Current directors/officers
  repeated EntityPerson directors = 10;
  
  // Schema.org entity definition
  SchemaOrgEntity schema_org = 11;
}

// Registered office address
message RegisteredAddress {
  // Street address
  string street = 1;
  
  // City
  string city = 2;
  
  // State/Province
  string state = 3;
  
  // Postal code
  string postal_code = 4;
  
  // Country
  string country = 5;
}

// Official entity contact information
message EntityContacts {
  // Registered email
  string registered_email = 1;
  
  // Official phone number
  string phone = 2;
  
  // GST/Tax number
  string tax_number = 3;
  
  // PAN number (India specific)
  string pan_number = 4;
  
  // Legal/compliance email
  string legal_email = 5;
  
  // Accounts/finance email
  string accounts_email = 6;
}

// Person associated with an entity
message EntityPerson {
  // Person's name
  string name = 1;
  
  // Role in the entity
  string role = 2;
  
  // Start date in role
  string start_date = 3;
  
  // End date (if applicable)
  string end_date = 4;
  
  // Person's Schema.org URL (if they have a domain)
  string person_url = 5;
}

// Decap CMS configuration for content management
message DecapCMSSettings {
  // Backend configuration
  DecapBackend backend = 1;
  
  // Media folder configuration
  string media_folder = 2;
  
  // Public folder for media
  string public_folder = 3;
  
  // Editorial workflow settings
  EditorialWorkflow editorial_workflow = 4;
  
  // Content collections configuration
  ContentCollections collections = 5;
  
  // Custom preview styles
  repeated string preview_styles = 6;
  
  // Custom widgets configuration
  map<string, CustomWidget> custom_widgets = 7;
  
  // Slug configuration
  SlugConfig slug = 8;
  
  // Default fields for all collections
  repeated CMSField default_fields = 9;
  
  // Gatsby integration settings
  GatsbyDecapIntegration gatsby_integration = 10;
}

// Decap CMS backend configuration
message DecapBackend {
  // Backend name ("git-gateway", "github", "gitlab", "test-repo")
  string name = 1;
  
  // Repository (for github/gitlab backends)
  string repo = 2;
  
  // Branch to use
  string branch = 3;
  
  // API root (for gitlab)
  string api_root = 4;
  
  // Auth endpoint (for git-gateway)
  string auth_endpoint = 5;
  
  // CMS label prefix
  string cms_label_prefix = 6;
}

// Editorial workflow configuration
message EditorialWorkflow {
  // Enable editorial workflow
  bool enabled = 1;
  
  // Publish mode ("simple", "editorial_workflow")
  string publish_mode = 2;
  
  // Preview context (site URL for previews)
  string preview_context = 3;
}

// Content collections configuration
message ContentCollections {
  // Posts collection settings
  CollectionConfig posts = 1;
  
  // Pages collection settings
  CollectionConfig pages = 2;
  
  // Custom collections
  map<string, CollectionConfig> custom = 3;
}

// Collection configuration
message CollectionConfig {
  // Collection name
  string name = 1;
  
  // Collection label
  string label = 2;
  
  // Folder path (relative to repo root)
  string folder = 3;
  
  // Create new entries
  bool create = 4;
  
  // Slug pattern
  string slug = 5;
  
  // Preview path pattern
  string preview_path = 6;
  
  // Editor configuration
  EditorConfig editor = 7;
  
  // Summary field pattern
  string summary = 8;
  
  // Sort configuration
  SortConfig sort = 9;
  
  // View filters
  repeated ViewFilter view_filters = 10;
  
  // View groups
  repeated ViewGroup view_groups = 11;
}

// Editor configuration
message EditorConfig {
  // Enable preview
  bool preview = 1;
  
  // Preview styles
  repeated string preview_styles = 2;
}

// Sort configuration
message SortConfig {
  // Field to sort by
  string field = 1;
  
  // Sort direction ("asc", "desc")
  string direction = 2;
}

// View filter configuration
message ViewFilter {
  // Filter label
  string label = 1;
  
  // Field to filter
  string field = 2;
  
  // Filter pattern
  string pattern = 3;
}

// View group configuration
message ViewGroup {
  // Group label
  string label = 1;
  
  // Field to group by
  string field = 2;
}

// Custom widget configuration
message CustomWidget {
  // Widget name
  string name = 1;
  
  // Widget type
  string type = 2;
  
  // Widget options
  map<string, string> options = 3;
}

// Slug configuration
message SlugConfig {
  // Slug encoding ("unicode", "ascii")
  string encoding = 1;
  
  // Clean accents
  bool clean_accents = 2;
  
  // Sanitize replacement character
  string sanitize_replacement = 3;
}

// CMS field definition
message CMSField {
  // Field name
  string name = 1;
  
  // Field label
  string label = 2;
  
  // Widget type
  string widget = 3;
  
  // Default value
  string default_value = 4;
  
  // Required field
  bool required = 5;
  
  // Field hint
  string hint = 6;
  
  // Pattern validation
  repeated string pattern = 7;
}

// Gatsby + Decap CMS integration settings
message GatsbyDecapIntegration {
  // Enable Gatsby preview with Decap CMS
  bool enable_preview = 1;
  
  // Preview update delay (milliseconds)
  int32 preview_update_delay = 2;
  
  // Enable real-time preview
  bool real_time_preview = 3;
  
  // Custom preview templates path
  string preview_templates_path = 4;
  
  // Widget scripts to load
  repeated string widget_scripts = 5;
  
  // Preview styles to inject
  repeated string preview_styles = 6;
}

// External organization definition for the ecosystem catalog
// These are organizations not owned by ecosystem entities (e.g., employers, partners)
message ExternalOrganization {
  // Short identifier (e.g., "AION", "SMART_JOULES")
  string key = 1;
  
  // Full organization name
  string name = 2;
  
  // Organization website URL
  string url = 3;
  
  // Organization type (e.g., "Corporation", "Startup", "NonProfit")
  string type = 4;
  
  // Brief description
  string description = 5;
  
  // Location (optional)
  string location = 6;
  
  // Industry/sector (optional)
  string industry = 7;
  
  // Schema.org entity definition (optional)
  SchemaOrgEntity schema_org = 8;
}

// Person affiliation with an organization using key references
// Used in PersonSchema for type-safe, dynamic affiliations
message PersonAffiliation {
  // Organization key from legal_entities or organizations catalog
  string organization_key = 1;
  
  // Role or position held
  string role = 2;
  
  // Type of affiliation (type-safe enum)
  AffiliationType type = 3;
  
  // Start date (ISO 8601 format, e.g., "2024-01-01")
  string start_date = 4;
  
  // End date (ISO 8601 format, omit if current)
  string end_date = 5;
  
  // Whether this is the primary/current affiliation
  bool is_primary = 6;
  
  // If true, look up in legal_entities catalog; if false, in organizations catalog
  bool is_legal_entity = 7;
  
  // Additional details or description (optional)
  string description = 8;
  
  // Whether this affiliation is currently active
  // Automatically true if end_date is empty or in the future
  bool is_current = 9;
  
  // Person's role in content creation (if applicable)
  PersonRole person_role = 10;
}

// =============================================================================
// CONTENT AND MEDIA CONFIGURATION
// =============================================================================
// Messages for rich content support including media, discussions, and interactions
// Maps to Schema.org MediaObject, DiscussionForumPosting, Event types
// =============================================================================

// Media content configuration for audio, video, images
// Maps to Schema.org AudioObject, VideoObject, ImageObject
message MediaContent {
  // Media type using enum
  MediaType type = 1;
  
  // Direct URL to media file
  string content_url = 2;
  
  // Embeddable URL (for YouTube, Vimeo, etc.)
  string embed_url = 3;
  
  // Thumbnail/preview image URL
  string thumbnail_url = 4;
  
  // Duration in ISO 8601 format (e.g., "PT1M33S")
  string duration = 5;
  
  // Transcript or description
  string transcript = 6;
  
  // Title of the media
  string title = 7;
  
  // Media encoding format (MIME type)
  string encoding_format = 8;
  
  // File size in bytes
  int64 content_size = 9;
  
  // Width in pixels (for images/video)
  int32 width = 10;
  
  // Height in pixels (for images/video)
  int32 height = 11;
  
  // Additional metadata as key-value pairs
  map<string, string> metadata = 12;
  
  // Google Drive specific settings
  GoogleDriveMedia google_drive = 13;
  
  // Caption/alt text for accessibility
  string caption = 14;
  
  // Creator/author of the media
  string creator = 15;
  
  // Upload/publication date
  string date_published = 16;
}

// Google Drive media integration
message GoogleDriveMedia {
  // Google Drive file ID
  string file_id = 1;
  
  // Folder ID where media is stored
  string folder_id = 2;
  
  // Enable direct streaming
  bool enable_streaming = 3;
  
  // Share settings (public, restricted, etc.)
  string share_setting = 4;
}

// Social discussion configuration for external platforms
// Maps to Schema.org DiscussionForumPosting, Comment
message SocialDiscussion {
  // Enable discussion features
  bool enabled = 1;
  
  // Platform-specific discussion URLs (key is platform name as string)
  map<string, string> discussion_urls = 2;
  
  // Enabled platforms for this entity
  repeated DiscussionPlatform enabled_platforms = 3;
  
  // Default text for discussion prompt
  string discussion_prompt = 4;
  
  // Show discussion section on mobile
  bool show_on_mobile = 5;
  
  // Position in article ("bottom", "sidebar")
  string position = 6;
  
  // Group discussions by category
  bool group_by_platform_type = 7;
}

// Appointment booking settings
// Maps to Schema.org ScheduleAction, Event, EventReservation
message AppointmentSettings {
  // Enable appointment booking
  bool enabled = 1;
  
  // Google Calendar ID for appointments
  string google_calendar_id = 2;
  
  // Public booking URL
  string booking_url = 3;
  
  // Time zone for appointments
  string time_zone = 4;
  
  // Available days of week (e.g., ["Monday", "Wednesday", "Friday"])
  repeated string available_days = 5;
  
  // Default appointment duration (ISO 8601, e.g., "PT30M")
  string default_duration = 6;
  
  // Minimum advance booking time (hours)
  int32 min_advance_hours = 7;
  
  // Maximum advance booking time (days)
  int32 max_advance_days = 8;
  
  // Buffer time between appointments (minutes)
  int32 buffer_minutes = 9;
  
  // Business hours
  BusinessHours business_hours = 10;
  
  // Appointment types available
  repeated AppointmentType appointment_types = 11;
  
  // Calendar embed settings
  CalendarEmbed embed_settings = 12;
}

// Business hours configuration
message BusinessHours {
  // Start time (24h format, e.g., "09:00")
  string start_time = 1;
  
  // End time (24h format, e.g., "17:00")
  string end_time = 2;
  
  // Lunch break start
  string lunch_start = 3;
  
  // Lunch break end
  string lunch_end = 4;
  
  // Custom hours per day
  map<string, DayHours> custom_hours = 5;
}

// Custom hours for specific days
message DayHours {
  // Is this day available
  bool available = 1;
  
  // Start time for this day
  string start_time = 2;
  
  // End time for this day
  string end_time = 3;
}

// Appointment type configuration
message AppointmentType {
  // Type name (e.g., "Consultation", "Technical Review")
  string name = 1;
  
  // Duration for this type (ISO 8601)
  string duration = 2;
  
  // Description
  string description = 3;
  
  // Price (if applicable)
  string price = 4;
  
  // Color for calendar display
  string color = 5;
}

// Calendar embed configuration
message CalendarEmbed {
  // Enable calendar embedding
  bool enabled = 1;
  
  // Embed height in pixels
  int32 height = 2;
  
  // Embed width (percentage or pixels)
  string width = 3;
  
  // Show only free/busy
  bool free_busy_only = 4;
  
  // Default view ("week", "month", "agenda")
  string default_view = 5;
}

// Enhanced code block settings
// Maps to Schema.org SoftwareSourceCode
message CodeBlockSettings {
  // Show line numbers
  bool show_line_numbers = 1;
  
  // Show copy button
  bool show_copy_button = 2;
  
  // Syntax highlighting theme
  string theme = 3;
  
  // Enable highlighting specific lines
  bool enable_line_highlighting = 4;
  
  // Tab size
  int32 tab_size = 5;
  
  // Wrap long lines
  bool wrap_lines = 6;
  
  // Show language label
  bool show_language_label = 7;
  
  // Enable diff view
  bool enable_diff_view = 8;
  
  // Max height before scroll (pixels)
  int32 max_height = 9;
  
  // Custom language mappings
  map<string, string> language_aliases = 10;
  
  // Enable inline code syntax highlighting
  bool inline_highlighting = 11;
}

// Technical content settings for academic/research content
// Maps to Schema.org ScholarlyArticle features
message TechnicalContentSettings {
  // Enable math formula rendering (LaTeX/KaTeX)
  bool enable_math = 1;
  
  // Math rendering engine ("katex", "mathjax")
  string math_engine = 2;
  
  // Enable Mermaid diagrams
  bool enable_mermaid = 3;
  
  // Mermaid theme ("default", "dark", "forest", "neutral")
  string mermaid_theme = 4;
  
  // Enable footnotes
  bool enable_footnotes = 5;
  
  // Footnote style ("numeric", "symbolic")
  string footnote_style = 6;
  
  // Enable table of contents
  bool enable_table_of_contents = 7;
  
  // TOC max depth (e.g., 3 for H1-H3)
  int32 toc_max_depth = 8;
  
  // TOC position ("left", "right", "top")
  string toc_position = 9;
  
  // Enable citations/bibliography
  bool enable_citations = 10;
  
  // Citation style ("apa", "mla", "chicago", "ieee")
  string citation_style = 11;
  
  // Enable glossary/definitions
  bool enable_definitions = 12;
  
  // Enable interactive examples
  bool enable_interactive = 13;
}

// Responsive display rules for components
// Controls visibility based on viewport size
message ResponsiveDisplayRules {
  // Components hidden on mobile
  repeated string mobile_hidden = 1;
  
  // Components visible only on tablet
  repeated string tablet_only = 2;
  
  // Components visible only on desktop
  repeated string desktop_only = 3;
  
  // Custom breakpoints
  BreakpointSettings breakpoints = 4;
  
  // Component-specific rules
  map<string, ComponentVisibility> component_rules = 5;
  
  // Enable responsive images
  bool responsive_images = 6;
  
  // Enable responsive tables
  bool responsive_tables = 7;
  
  // Mobile-first approach
  bool mobile_first = 8;
}

// Breakpoint configuration
message BreakpointSettings {
  // Mobile max width (pixels)
  int32 mobile_max = 1;
  
  // Tablet min width (pixels)
  int32 tablet_min = 2;
  
  // Tablet max width (pixels)
  int32 tablet_max = 3;
  
  // Desktop min width (pixels)
  int32 desktop_min = 4;
  
  // Custom breakpoints
  map<string, int32> custom = 5;
}

// Component visibility rules
message ComponentVisibility {
  // Show on mobile
  bool mobile = 1;
  
  // Show on tablet
  bool tablet = 2;
  
  // Show on desktop
  bool desktop = 3;
  
  // Alternative component for different sizes
  map<string, string> alternatives = 4;
}

// Error page content configuration
// For quirky 404, 500, etc. messages
message ErrorPageContent {
  // Error code to message mapping
  map<int32, ErrorMessage> error_messages = 1;
  
  // Default error message template
  string default_template = 2;
  
  // Learn more URL suffix
  string learn_more_suffix = 3;
  
  // Enable quirky messages
  bool enable_quirky_messages = 4;
  
  // Rotation strategy for multiple messages
  string rotation_strategy = 5; // "random", "sequential", "time-based"
  
  // Custom CTA buttons for error pages
  repeated ErrorPageCTA cta_buttons = 6;
}

// Individual error message configuration
message ErrorMessage {
  // Error code (404, 500, etc.)
