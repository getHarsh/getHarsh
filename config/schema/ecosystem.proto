  repeated string domain_keys = 5;
  
  // Project keys hosted under this brand
  // Populated dynamically from PROJECTS/ discovery
  repeated string project_keys = 6;
  
  // Special flag for personal brands (like getHarsh)
  bool is_personal_brand = 7;
  
  // Special flag for entity website brands (like rawThoughts, daostudio)
  bool is_entity_website = 8;
  
  // Schema.org entity definition for the brand
  SchemaOrgEntity schema_org = 9;
  
  // Brand color (hex) for visual identity
  string color = 10;
  
  // Brand focus area (e.g., "research", "consulting", "creative")
  string focus_area = 11;
}

