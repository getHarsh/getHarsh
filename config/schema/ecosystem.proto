  // Primary message
  string message = 2;
  
  // Secondary/explanation text
  string explanation = 3;
  
  // Quirky variations
  repeated string variations = 4;
  
  // Custom image/illustration URL
  string image_url = 5;
  
  // Tone ("playful", "apologetic", "technical")
