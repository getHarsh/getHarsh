  // References organizations by key from legal_entities or organizations catalogs
  repeated PersonAffiliation affiliations = 8;
  
  // Domain keys this person created (e.g., ["getHarsh", "causality"])
  // Populated dynamically from ecosystem.domains mapping
  repeated string creator_of_keys = 9;
  
  // Project keys this person authored (e.g., ["HENA", "JARVIS-kernel"])
  // Populated dynamically from PROJECTS/ discovery
  repeated string author_of_keys = 10;
  
