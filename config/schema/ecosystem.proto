// Project lifecycle stages based on ecosystem philosophy
// From what_is_getHarsh.md: emerge, scale, stagnate, pivot, accelerate
enum ProjectLifecycle {
  PROJECT_LIFECYCLE_UNSPECIFIED = 0;
  PROJECT_LIFECYCLE_EMERGE = 1;      // New project emerging
  PROJECT_LIFECYCLE_SCALE = 2;       // Growing and scaling
  PROJECT_LIFECYCLE_STAGNATE = 3;    // Development slowed/paused
  PROJECT_LIFECYCLE_PIVOT = 4;       // Changing direction
  PROJECT_LIFECYCLE_ACCELERATE = 5;  // Rapid growth phase
  PROJECT_LIFECYCLE_MAINTAIN = 6;    // Stable maintenance mode
  PROJECT_LIFECYCLE_SUNSET = 7;      // Winding down
  PROJECT_LIFECYCLE_ARCHIVED = 8;    // No longer active
}

// Project development status (different from lifecycle)
// Maps to CreativeWork status properties in Schema.org
enum ProjectDevelopmentStatus {
  PROJECT_STATUS_UNSPECIFIED = 0;
  PROJECT_STATUS_CONCEPT = 1;      // Conceptual stage
  PROJECT_STATUS_ALPHA = 2;        // Alpha development
  PROJECT_STATUS_BETA = 3;         // Beta testing
  PROJECT_STATUS_STABLE = 4;       // Production ready
  PROJECT_STATUS_DEPRECATED = 5;   // Deprecated but available
  PROJECT_STATUS_ARCHIVED = 6;     // Archived/read-only
}

