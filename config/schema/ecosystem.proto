// Buy Me a Coffee configuration
message BuyMeACoffeeSettings {
  // Username
  string username = 1;
  
  // Widget URL
  string widget_url = 2;
  
  // Button color
  string button_color = 3;
}

// PayPal configuration
message PayPalSettings {
  // PayPal.me username
  string paypal_me = 1;
  
  // Business email
  string business_email = 2;
  
  // Currency code
  string currency = 3;
  
  // Button style
  string button_style = 4;
}

// Sponsor wall configuration
message SponsorWall {
  // Enable sponsor wall
  bool enabled = 1;
  
  // Wall position ("/sponsors" page)
  string page_path = 2;
  
  // Group by tier
  bool group_by_tier = 3;
  
  // Show amounts
  bool show_amounts = 4;
  
  // Anonymous option
  bool allow_anonymous = 5;
  
  // Update frequency
  string update_frequency = 6;
}

// Schema.org configuration for build-time mapping
message SchemaOrgConfig {
  // Enable Schema.org JSON-LD generation
  bool enabled = 1;
  
  // Mapping mode ("automatic", "manual", "hybrid")
  string mapping_mode = 2;
  
  // Include all enum mappings in build
  bool include_all_mappings = 3;
  
  // Specific mappings to include (if not including all)
  repeated string included_mappings = 4;
  
  // Custom mapping overrides
  map<string, string> custom_mappings = 5;
  
  // Validation settings
  SchemaOrgValidation validation = 6;
}

// Schema.org validation settings
message SchemaOrgValidation {
  // Validate against Schema.org vocabulary
  bool validate_types = 1;
  
  // Validate required properties
  bool validate_required = 2;
  
  // Allow custom properties
  bool allow_custom_properties = 3;
  
  // Strict mode (fail on warnings)
  bool strict_mode = 4;
}

// Global Schema.org settings
message SchemaOrgGlobalSettings {
  // Default @context
  string default_context = 1; // "https://schema.org"
  
  // Include @id for all entities
  bool include_ids = 2;
  
  // Base URL for @id generation
  string base_url = 3;
  
  // Default language
  string default_language = 4;
  
  // Include breadcrumbs
  bool include_breadcrumbs = 5;
  
  // Rich snippets configuration
  RichSnippetsConfig rich_snippets = 6;
}

// Rich snippets configuration
message RichSnippetsConfig {
  // Enable rich snippets
  bool enabled = 1;
  
  // Types to generate snippets for
  repeated string snippet_types = 2;
  
  // Include preview images
  bool include_images = 3;
  
  // Include ratings/reviews
  bool include_ratings = 4;
}

// Smart link settings for rich semantic links
// Maps to various Schema.org types based on link destination
message SmartLinkSettings {
  // Enable smart link detection
  bool enabled = 1;
  
  // Auto-detect link types
  bool auto_detect = 2;
  
  // Show icons for link types
  bool show_icons = 3;
  
  // Add ARIA labels
  bool add_aria_labels = 4;
  
  // Link type detection patterns
  LinkTypePatterns patterns = 5;
  
  // Custom link type mappings
  map<string, LinkTypeConfig> custom_types = 6;
  
  // Ecosystem domains (auto-populated from config)
  repeated string ecosystem_domains = 7;
  
  // Open external links in new tab
  bool external_new_tab = 8;
  
  // Add rel="nofollow" to external links
  bool external_nofollow = 9;
}

// Link type detection patterns
message LinkTypePatterns {
  // Google Workspace patterns
  repeated string google_docs = 1;
  repeated string google_sheets = 2;
  repeated string google_slides = 3;
  repeated string google_drive = 4;
  
  // GitHub patterns
  repeated string github_repo = 5;
  repeated string github_file = 6;
  repeated string github_issue = 7;
  repeated string github_pr = 8;
  
  // File extension patterns
  map<string, string> file_extensions = 9;
}

// Link type configuration
message LinkTypeConfig {
  // Type name
  string type = 1;
  
  // Icon class or URL
  string icon = 2;
  
  // ARIA label template
  string aria_label = 3;
  
  // CSS class to apply
  string css_class = 4;
  
  // Schema.org type
  string schema_type = 5;
}

// LinkedIn conversion configuration
message LinkedInConversion {
  // Conversion ID from LinkedIn Campaign Manager
  string conversion_id = 1;
  
  // Conversion name for tracking
  string conversion_name = 2;
  
  // Conversion value (optional)
  double value = 3;
  
  // Currency code (e.g., "USD", "EUR")
  string currency = 4;
  
  // Trigger conditions
  repeated string triggers = 5;
}