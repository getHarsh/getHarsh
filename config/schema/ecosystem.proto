// EcosystemConfig defines the default configuration inherited by all domains.
// These values are stored in getHarsh/config/ecosystem-defaults.yml
// and are automatically inherited by all domain configurations.
message EcosystemConfig {
  // Analytics configuration shared across all domains
  Analytics analytics = 1;
  
  // Default SEO settings for all domains
  SeoDefaults seo_defaults = 2;
  
  // Gatsby plugins used by all sites
  repeated string gatsby_plugins = 3;
  
  // Default content settings
  ContentDefaults content_defaults = 4;
  
  // Cross-domain navigation configuration
  CrossDomainNav cross_domain_nav = 5;
  
  // Environment variable definitions required by the system
  map<string, EnvironmentVar> environment_vars = 6;
  
  // Cross-domain ecosystem mapping and relationships
  EcosystemMap ecosystem = 7;
  
  // Build and Gatsby configuration
  BuildSettings build_settings = 8;
  
  // Default theme settings inherited by all domains
  ThemeDefaults theme_defaults = 9;
  
  // Security configuration and environment variable classification
  SecuritySettings security = 10;
  
  // Default feature flags for all domains
  FeatureFlags features = 11;
  
  // AI agent integration settings
  AIAgentSettings ai_agent = 12;
  
  // Copyright configuration
  CopyrightSettings copyright = 13;
  
  // Default timezone for all sites
  string timezone = 14;
  
  // Cookie consent configuration (LEGALLY REQUIRED for GA/FB Pixel)
  ConsentSettings consent_settings = 15;
  
  // Security headers for GitHub Pages (CSP via meta tags)
  SecurityHeaders security_headers = 16;
  
  // Performance monitoring and optimization settings
  PerformanceSettings performance = 17;
  
  // Enhanced analytics services configuration
  AnalyticsServices analytics_services = 18;
  
  // Social platforms configuration
  SocialPlatforms social_platforms = 19;
  
  // Google services configuration
  GoogleServices google_services = 20;
  
  // Search engine tools configuration
  SearchEngineTools search_tools = 21;
  
  // Structured data (JSON-LD) configuration
  StructuredDataSettings structured_data = 22;
  
  // Component default settings
  ComponentDefaults component_defaults = 23;
  
  // Ecosystem learn more URL (e.g., GitHub README)
  string ecosystem_learn_more_url = 24;
  
  // Decap CMS configuration
  DecapCMSSettings decap_cms = 25;
  
  // RSS feed configuration
  RSSFeedSettings rss_feed = 26;
  
  // Audio player settings for Google Drive integration
  AudioSettings audio_settings = 27;
  
  // Footer technical links configuration
  TechnicalLinks technical_links = 28;
  
  // Policy page links configuration
  // See: ../SCHEMA-ORG-EXAMPLES.md#inheritance-and-override-rules
  PolicyLinks policy_links = 29;
  
  // Default Schema.org entity type for domains
  // Default: SCHEMA_ORG_ORGANIZATION - can be overridden per domain
  // See: ../SCHEMA-ORG-EXAMPLES.md for entity type examples
  SchemaOrgEntityType default_schema_org_type = 30;
  
  // Legal entities catalog - all entities in the ecosystem
  // Domains reference these by key (e.g., "RTEPL", "DSPL")
  map<string, LegalEntity> legal_entities = 31;
  
  // Authors catalog - person keys who can author content
  // Only persons who write articles/posts (appear in Decap CMS)
  // References keys from the persons catalog
  repeated string authors = 32;
  
  // External organizations catalog - organizations not owned by ecosystem entities
  // Referenced by key in person affiliations (e.g., "AION", "SMART_JOULES")
  map<string, ExternalOrganization> organizations = 33;
  
  // Persons catalog - all persons in the ecosystem
  // Includes founders, directors, employees, advisors, etc.
  // Referenced by key (e.g., "harsh", "john_doe")
  map<string, PersonSchema> persons = 34;
  
  // Brands catalog - all brands in the ecosystem
  // Brands are verticals of legal entities that group projects
  // Referenced by key (e.g., "getHarsh", "causality", "rawThoughts")
  map<string, Brand> brands = 35;
  
  // Communities catalog - external communities that leverage ecosystem
  // Referenced by key (e.g., "UPAI")
  map<string, Community> communities = 36;
  
  // Entity relationships - all entity-to-entity relationships
  // Supports flexible relationships between any entities
  repeated EntityRelationship entity_relationships = 37;
  
  // Schema.org mapping configuration
  // Controls how enums are mapped to Schema.org types at build time
  SchemaOrgConfig schema_org_config = 38;
  
  // Schema.org global settings
  // Default values for all Schema.org JSON-LD generation
  SchemaOrgGlobalSettings schema_org_settings = 39;
}

// Analytics configuration for tracking and metrics
message Analytics {
  // Google Analytics tracking ID (supports ${GA_TRACKING_ID})
  string ga_tracking_id = 1;
  
  // Meta/Facebook Pixel ID (supports ${META_PIXEL_ID})
  string meta_pixel_id = 2;
  
  // Enable cross-domain tracking between ecosystem sites
  bool cross_domain_tracking = 3;
  
  // Domains to link for cross-domain tracking
  repeated string linked_domains = 4;
  
  // Twitter Pixel configuration
  TwitterPixel twitter_pixel = 5;
  
  // LinkedIn Insight Tag configuration
  LinkedInInsight linkedin_insight = 6;
}

// Default SEO settings inherited by all domains
message SeoDefaults {
  // Default author name for meta tags
  string author = 1;
  
  // Default locale (e.g., "en_US")
  string locale = 2;
  
  // Default Twitter handle for cards
  string twitter = 3;
  
  // Default meta description pattern (can use variables)
  string description_pattern = 4;
  
  // Default OG image URL pattern
  string og_image_pattern = 5;
  
  // Enable/disable AI crawler optimization (LLMs.txt)
  bool enable_llms_txt = 6;
  
  // Default copyright pattern (e.g., "© {year} {entity}")
  string copyright_pattern = 7;
}

// Default content settings for posts and pages
message ContentDefaults {
  // Default excerpt length in words
  int32 excerpt_length = 1;
  
  // Default posts per page for pagination
  int32 posts_per_page = 2;
  
  // Default date format (e.g., "%B %d, %Y")
  string date_format = 3;
  
  // Enable reading time calculation by default
  bool show_reading_time = 4;
  
  // Words per minute for reading time calculation
  int32 reading_wpm = 5;
}

// Cross-domain navigation configuration
message CrossDomainNav {
  // Enable ecosystem navigation bar
  bool enabled = 1;
  
  // Position of the nav bar ("top", "bottom")
  string position = 2;
  
  // Domains to show in navigation (order matters)
  repeated string domains = 3;
}

// Environment variable definition with security classification
message EnvironmentVar {
  // Description of what this variable is for
  string description = 1;
  
  // Whether this variable is required
  bool required = 2;
  
  // Default value if not set (optional)
  string default_value = 3;
  
  // Example value for documentation
  string example = 4;
  
  // Security classification for redaction
  SecurityLevel security_level = 5;
  
  // Redaction strategy when publishing
  RedactionStrategy redaction_strategy = 6;
}

// Security classification for environment variables
enum SecurityLevel {
  // Public information (domains, titles, public emails)
  PUBLIC = 0;
  
  // Sensitive but can be partially shown (analytics IDs)
  SENSITIVE = 1;
  
  // Secret - must never be exposed (API keys, tokens)
  SECRET = 2;
}

// How to redact sensitive values before publishing
enum RedactionStrategy {
  // No redaction needed (PUBLIC level)
  NONE = 0;
  
  // Partial redaction (e.g., GA-XXXXXXXX)
  PARTIAL = 1;
  
  // Complete removal from published files
  REMOVE = 2;
  
  // Replace with placeholder (e.g., [REDACTED])
  PLACEHOLDER = 3;
}

// Cross-domain ecosystem mapping
message EcosystemMap {
  // All domains in the ecosystem with their metadata
  map<string, DomainMetadata> domains = 1;
}

// Metadata for each domain in the ecosystem
message DomainMetadata {
  // Primary domain (e.g., "getHarsh.in")
  string domain = 1;
  
  // Blog subdomain (e.g., "blog.getHarsh.in")
  string blog = 2;
  
  // Legal entity that owns this domain (e.g., "RTEPL", "DSPL")
  string entity = 3;
  
  // Brand color for this domain (hex)
  string color = 4;
  
  // Projects hosted under this domain
  repeated string projects = 5;
}

// Build and Gatsby configuration
message BuildSettings {
  // Gatsby build mode ("development", "production")
  string build_mode = 1;
  
  // Path prefix for deployment (e.g., "/blog" for subpath deployment)
  string path_prefix = 2;
  
  // Asset prefix for CDN
  string asset_prefix = 3;
  
  // Build flags
  BuildFlags flags = 4;
  
  // MDX configuration for content
  MDXSettings mdx = 5;
}

// Build flags for Gatsby
message BuildFlags {
  // Enable fast refresh in development
  bool fast_refresh = 1;
  
  // Enable build caching
  bool cache = 2;
  
  // Enable parallel processing
  bool parallel = 3;
  
  // Enable verbose logging
  bool verbose = 4;
}

// MDX settings for content processing
message MDXSettings {
  // Enable MDX for markdown processing
  bool enabled = 1;
  
  // Extensions to process as MDX
  repeated string extensions = 2;
  
  // Remark plugins
  repeated string remark_plugins = 3;
  
  // Rehype plugins  
  repeated string rehype_plugins = 4;
  
  // Gatsby remark plugins
  repeated GatsbyRemarkPlugin gatsby_remark_plugins = 5;
}

// Gatsby remark plugin configuration
message GatsbyRemarkPlugin {
  // Plugin name
  string name = 1;
  
