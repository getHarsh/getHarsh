# Standard consent categories (static site optimized)
StandardCategories:
  necessary:
    name: "Necessary"
    description: "Essential cookies required for the website to function properly"
    required: true
    pre_selected: true
    providers:
      - "GitHub Pages"  # Hosting
      - "CloudFlare"   # CDN/Security
    cookies:
      - name: "consent_state"
        type: "first_party"
        expiry: "1 year"
  
  analytics:
    name: "Analytics"
    description: "Help us understand how visitors interact with our websites"
    required: false
    pre_selected: false
    providers:
      - "Google Analytics"
      - "Microsoft Clarity"
      - "Plausible Analytics"
    cookies:
      - name: "_ga"
        type: "first_party"
        expiry: "2 years"
      - name: "_gid"
        type: "first_party"
        expiry: "24 hours"
  
  marketing:
    name: "Marketing"
    description: "Used to track visitors across websites for advertising"
    required: false
    pre_selected: false
    providers:
      - "Meta Pixel"
      - "Twitter Pixel"
      - "LinkedIn Insight Tag"
      - "Google Ads"
    cookies:
      - name: "_fbp"
        type: "third_party"
        expiry: "3 months"
      - name: "li_sugr"
        type: "third_party"
        expiry: "90 days"
  
  functional:
    name: "Functional"
    description: "Enable enhanced functionality like embedded content"
    required: false
    pre_selected: false  # Changed to false for GDPR compliance
    providers:
      - "YouTube"          # Video embeds
      - "Google Calendar"  # Appointment booking
      - "Google Drive"     # Audio player
    cookies:
      - name: "theme_preference"  # Light/dark mode
        type: "first_party"
        expiry: "1 year"
  
  social_media:
    name: "Social Media"
    description: "Enable social media features and sharing"
    required: false
    pre_selected: false
    providers:
      - "Twitter"
      - "LinkedIn"
      - "Facebook"
    cookies:
      - name: "datr"
        type: "third_party"
        expiry: "2 years"

