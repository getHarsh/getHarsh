# Regional defaults
RegionalDefaults:
  EU:
    laws: ["GDPR"]
    default_consent:
      analytics: "denied"
      marketing: "denied"
      functional: "granted"
      necessary: "granted"
    minimum_age: 16
    parental_consent_age: 13
  
  US:
    laws: []
    default_consent:
      analytics: "granted"
      marketing: "granted"
      functional: "granted"
      necessary: "granted"
    minimum_age: 13
    parental_consent_age: 13
  
  US-CA:
    laws: ["CCPA"]
    default_consent:
      analytics: "granted"
      marketing: "denied"
      functional: "granted"
      necessary: "granted"
    minimum_age: 13
    parental_consent_age: 13
    
  IN:
    laws: ["DPA"]
    default_consent:
      analytics: "granted"
      marketing: "granted"
      functional: "granted"
      necessary: "granted"
    minimum_age: 18
    parental_consent_age: 18

# Entity-based consent boundaries
# Each entity in EntityCatalog creates a consent boundary
# Build system reads from ecosystem.legal_entities catalog
EntityConsentBoundaries:
  # Pattern for all legal entities (not hardcoded)
  entity_pattern:
    entity_type: ENTITY_TYPE_LEGAL_ENTITY
    consent_scope: "separate_controller"
    cookie_sharing: "within_entity_only"
    data_controller: true
    
  # Entity relationships affect consent
  relationship_rules:
    - relationship: RELATIONSHIP_OWNS
      consent_sharing: "allowed_with_disclosure"
    - relationship: RELATIONSHIP_PARTNER
      consent_sharing: "separate_consent_required"
    - relationship: RELATIONSHIP_PARENT_ORGANIZATION
      consent_sharing: "inherited_with_notice"

# Cookie SameSite values
CookieSameSite:
  strict: "Strict"
  lax: "Lax"
  none: "None"

# Browser-specific consent handling
BrowserSpecificHandling:
  safari:
    # Safari ITP (Intelligent Tracking Prevention) considerations
    storage_access_api: true
    cookie_lifetime_limit: "7 days"
    third_party_cookies: "blocked by default"
    recommendations:
      - "Use first-party cookies only"
      - "Implement Storage Access API for embeds"
      - "Refresh consent within 7 days"
  
  chrome:
    # Chrome Privacy Sandbox
    third_party_phase_out: "2024"
    topics_api: "available"
    recommendations:
      - "Prepare for cookieless future"
      - "Consider Topics API integration"
      - "Focus on first-party data"
  
  firefox:
    # Firefox Enhanced Tracking Protection
    tracking_protection: "standard"
    third_party_cookies: "blocked in private mode"
    recommendations:
      - "Test in private browsing mode"
      - "Use explicit consent for all tracking"

# Cross-domain consent limitations
CrossDomainLimitations:
  technical_constraints:
    - "Third-party cookies blocked by default in Safari/Firefox"
    - "SameSite=Lax default prevents cross-domain sharing"
    - "localStorage not shared across domains"
    - "postMessage requires explicit origin validation"
  
  recommended_approach:
    primary_method: "Independent consent per domain"
    sync_method: "Server-side sync with consent IDs"
    fallback: "Re-request consent on each domain"
    
  implementation_notes:
    - "Each domain maintains own consent state"
    - "Use consent ID to sync server-side"
    - "Display sync status to users"
    - "Honor most restrictive consent across domains"

