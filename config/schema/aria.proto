syntax = "proto3";

package website.config.aria;

option go_package = "github.com/getHarsh/getHarsh/config/aria";

// =============================================================================
// ARIA & ACCESSIBILITY CONFIGURATION PROTO
// =============================================================================
// Defines comprehensive accessibility configuration following WCAG 2.1 AA
// standards with ARIA (Accessible Rich Internet Applications) support.
//
// This schema enables:
// - WCAG 2.1 AA compliance
// - Screen reader optimization
// - Keyboard navigation enhancement
// - Focus management
// - Color contrast enforcement
// - Alternative text management
// - Semantic HTML structure
// - Assistive technology support
//
// Related Documentation:
// - Implementation Guide: ../ARIA-EXAMPLES.md
// - Mappings: aria-mappings.yml
// - Parent Schema: ecosystem.proto
// =============================================================================

// ARIAConfig defines the complete accessibility configuration
message ARIAConfig {
  // Core accessibility settings
  AccessibilityCore core = 1;
  
  // ARIA attributes configuration
  ARIAAttributes aria = 2;
  
  // Keyboard navigation settings
  KeyboardNavigation keyboard = 3;
  
  // Focus management configuration
  FocusManagement focus = 4;
  
  // Visual accessibility settings
  VisualAccessibility visual = 5;
  
  // Audio accessibility settings
  AudioAccessibility audio = 6;
  
  // Content accessibility settings
  ContentAccessibility content = 7;
  
  // Navigation accessibility
  NavigationAccessibility navigation = 8;
  
  // Form accessibility
  FormAccessibility forms = 9;
  
  // Interactive elements accessibility
  InteractiveAccessibility interactive = 10;
  
  // Testing and validation
  AccessibilityTesting testing = 11;
  
  // Assistive technology support
  AssistiveTechnology assistive = 12;
}

// Core accessibility settings
message AccessibilityCore {
  // Enable accessibility features
  bool enabled = 1;
  
  // WCAG compliance level
  WCAGLevel compliance_level = 2;
  
  // Language settings
  LanguageSettings language = 3;
  
  // Skip links configuration
  SkipLinks skip_links = 4;
  
  // Landmarks configuration
  Landmarks landmarks = 5;
  
  // Live regions configuration
  LiveRegions live_regions = 6;
  
  // Error handling
  ErrorHandling error_handling = 7;
  
  // Accessibility statement
  AccessibilityStatement statement = 8;
}

// WCAG compliance levels
enum WCAGLevel {
  WCAG_LEVEL_UNSPECIFIED = 0;
  WCAG_LEVEL_A = 1;
  WCAG_LEVEL_AA = 2;
  WCAG_LEVEL_AAA = 3;
}

// Language settings for accessibility
message LanguageSettings {
  // Primary language code
  string primary_language = 1;
  
  // Language direction (ltr/rtl)
  string direction = 2;
  
  // Multi-language support
  bool multi_language = 3;
  
  // Language switcher ARIA
  string language_switcher_label = 4;
  
  // Hreflang implementation
  bool hreflang_enabled = 5;
}

// Skip links configuration
message SkipLinks {
  // Enable skip links
  bool enabled = 1;
  
  // Skip link items
  repeated SkipLink links = 2;
  
  // Skip link styling
  SkipLinkStyling styling = 3;
}

// Individual skip link
message SkipLink {
  // Link text
  string text = 1;
  
  // Target element ID
  string target = 2;
  
  // Keyboard shortcut
  string shortcut = 3;
  
  // ARIA label
  string aria_label = 4;
}

// Skip link styling
message SkipLinkStyling {
  // Show on focus only
  bool show_on_focus = 1;
  
  // Position
  string position = 2;
  
  // Z-index
  int32 z_index = 3;
  
  // Custom CSS class
  string css_class = 4;
}

// Landmarks configuration
message Landmarks {
  // Enable ARIA landmarks
  bool enabled = 1;
  
  // Main landmark
  LandmarkConfig main = 2;
  
  // Navigation landmark
  LandmarkConfig navigation = 3;
  
  // Banner landmark
  LandmarkConfig banner = 4;
  
  // Complementary landmark
  LandmarkConfig complementary = 5;
  
  // Content info landmark
  LandmarkConfig contentinfo = 6;
  
  // Search landmark
  LandmarkConfig search = 7;
  
  // Custom landmarks
  repeated CustomLandmark custom = 8;
}

// Landmark configuration
message LandmarkConfig {
  // Enable this landmark
  bool enabled = 1;
  
  // ARIA label
  string aria_label = 2;
  
  // ARIA labelledby
  string aria_labelledby = 3;
  
  // Multiple instances handling
  bool multiple_allowed = 4;
}

// Custom landmark
message CustomLandmark {
  // Landmark role
  string role = 1;
  
  // Landmark label
  string label = 2;
  
  // CSS selector
  string selector = 3;
}

// Live regions configuration
message LiveRegions {
  // Enable live regions
  bool enabled = 1;
  
  // Status messages
  LiveRegionConfig status = 2;
  
  // Alert messages
  LiveRegionConfig alerts = 3;
  
  // Progress indicators
  LiveRegionConfig progress = 4;
  
  // Notifications
  LiveRegionConfig notifications = 5;
  
  // Custom live regions
  repeated CustomLiveRegion custom = 6;
}

// Live region configuration
message LiveRegionConfig {
  // Enable this live region
  bool enabled = 1;
  
  // Politeness level
  PolitenessLevel politeness = 2;
  
  // Atomic updates
  bool atomic = 3;
  
  // Relevant changes
  string relevant = 4;
}

// Politeness levels for live regions
enum PolitenessLevel {
  POLITENESS_LEVEL_UNSPECIFIED = 0;
  POLITENESS_LEVEL_OFF = 1;
  POLITENESS_LEVEL_POLITE = 2;
  POLITENESS_LEVEL_ASSERTIVE = 3;
}

// Custom live region
message CustomLiveRegion {
  // Region identifier
  string id = 1;
  
  // CSS selector
  string selector = 2;
  
  // Configuration
  LiveRegionConfig config = 3;
}

// Error handling for accessibility
message ErrorHandling {
  // Announce errors to screen readers
  bool announce_errors = 1;
  
  // Error message format
  string error_format = 2;
  
  // Associate errors with fields
  bool associate_with_fields = 3;
  
  // Error summary
  bool show_error_summary = 4;
  
  // Focus on first error
  bool focus_on_error = 5;
}

// Accessibility statement
message AccessibilityStatement {
  // Enable statement page
  bool enabled = 1;
  
  // Statement URL
  string url = 2;
  
  // Last updated date
  string last_updated = 3;
  
  // Conformance level
  string conformance = 4;
  
  // Contact information
  string contact = 5;
}

// ARIA attributes configuration
message ARIAAttributes {
  // Global ARIA attributes
  GlobalARIA global = 1;
  
  // Widget ARIA patterns
  WidgetARIA widgets = 2;
  
  // Document structure ARIA
  DocumentARIA document = 3;
  
  // Application ARIA
  ApplicationARIA application = 4;
  
  // Custom ARIA rules
  repeated ARIARule custom_rules = 5;
}

// Global ARIA attributes
message GlobalARIA {
  // Auto-generate ARIA labels
  bool auto_labels = 1;
  
  // Use ARIA describedby
  bool use_describedby = 2;
  
  // ARIA hidden handling
  ARIAHiddenHandling hidden_handling = 3;
  
  // ARIA label format
  string label_format = 4;
}

// ARIA hidden handling
message ARIAHiddenHandling {
  // Hide decorative images
  bool hide_decorative = 1;
  
  // Hide icon fonts
  bool hide_icons = 2;
  
  // Respect explicit hidden
  bool respect_explicit = 3;
}

// Widget ARIA patterns
message WidgetARIA {
  // Button patterns
  ButtonARIA buttons = 1;
  
  // Link patterns
  LinkARIA links = 2;
  
  // Menu patterns
  MenuARIA menus = 3;
  
  // Dialog patterns
  DialogARIA dialogs = 4;
  
  // Tab patterns
  TabARIA tabs = 5;
  
  // Accordion patterns
  AccordionARIA accordions = 6;
  
  // Carousel patterns
  CarouselARIA carousels = 7;
}

// Button ARIA configuration
message ButtonARIA {
  // Require accessible names
  bool require_names = 1;
  
  // Button state announcements
  bool announce_states = 2;
  
  // Loading state pattern
  string loading_pattern = 3;
  
  // Disabled state handling
  string disabled_handling = 4;
}

// Link ARIA configuration
message LinkARIA {
  // External link indication
  bool indicate_external = 1;
  
  // New window warning
  bool new_window_warning = 2;
  
  // Download indication
  bool indicate_download = 3;
  
  // Current page indication
  bool indicate_current = 4;
  
  // Link purpose requirement
  bool require_purpose = 5;
}

// Menu ARIA configuration
message MenuARIA {
  // Menu orientation
  string orientation = 1;
  
  // Submenu indication
  bool indicate_submenu = 2;
  
  // Menu item states
  bool announce_states = 3;
  
  // Keyboard navigation
  bool enhanced_keyboard = 4;
}

// Dialog ARIA configuration
message DialogARIA {
  // Modal handling
  bool modal_handling = 1;
  
  // Focus trap
  bool focus_trap = 2;
  
  // Close button requirement
  bool require_close = 3;
  
  // Title requirement
  bool require_title = 4;
  
  // Announce on open
  bool announce_on_open = 5;
}

// Tab ARIA configuration
message TabARIA {
  // Tab orientation
  string orientation = 1;
  
  // Auto activation
  bool auto_activation = 2;
  
  // Tab panel association
  bool panel_association = 3;
  
  // Keyboard navigation
  bool arrow_navigation = 4;
}

// Accordion ARIA configuration
message AccordionARIA {
  // Multi-expand allowed
  bool multi_expand = 1;
  
  // Announce state changes
  bool announce_changes = 2;
  
  // Header level
  int32 header_level = 3;
  
  // Keyboard navigation
  bool enhanced_keyboard = 4;
}

// Carousel ARIA configuration
message CarouselARIA {
  // Auto-play handling
  bool autoplay_control = 1;
  
  // Slide announcements
  bool announce_slides = 2;
  
  // Navigation labels
  bool navigation_labels = 3;
  
  // Live region for updates
  bool live_updates = 4;
}

// Document structure ARIA
message DocumentARIA {
  // Heading structure
  HeadingStructure headings = 1;
  
  // List structure
  ListStructure lists = 2;
  
  // Table structure
  TableStructure tables = 3;
  
  // Article structure
  ArticleStructure articles = 4;
}

// Heading structure configuration
message HeadingStructure {
  // Enforce hierarchy
  bool enforce_hierarchy = 1;
  
  // Single H1 rule
  bool single_h1 = 2;
  
  // Empty heading check
  bool check_empty = 3;
  
  // Heading landmarks
  bool use_landmarks = 4;
}

// List structure configuration
message ListStructure {
  // Proper nesting
  bool enforce_nesting = 1;
  
  // List item requirement
  bool require_items = 2;
  
  // Description lists
  bool support_description = 3;
}

// Table structure configuration
message TableStructure {
  // Require captions
  bool require_captions = 1;
  
  // Header associations
  bool header_associations = 2;
  
  // Scope attributes
  bool use_scope = 3;
  
  // Summary for complex tables
  bool complex_summary = 4;
}

// Article structure configuration
message ArticleStructure {
  // Article landmarks
  bool use_article_role = 1;
  
  // Time elements
  bool semantic_time = 2;
  
  // Author information
  bool author_info = 3;
}

// Application ARIA configuration
message ApplicationARIA {
  // Application role usage
  bool use_application_role = 1;
  
  // Widget context
  bool provide_context = 2;
  
  // Instructions
  bool provide_instructions = 3;
  
  // Mode switching
  bool mode_announcements = 4;
}

// Custom ARIA rule
message ARIARule {
  // Rule name
  string name = 1;
  
  // CSS selector
  string selector = 2;
  
  // Required attributes
  repeated string required_attributes = 3;
  
  // Forbidden attributes
  repeated string forbidden_attributes = 4;
  
  // Validation function
  string validation = 5;
}

// Keyboard navigation configuration
message KeyboardNavigation {
  // Enable enhanced keyboard navigation
  bool enabled = 1;
  
  // Tab order management
  TabOrder tab_order = 2;
  
  // Keyboard shortcuts
  KeyboardShortcuts shortcuts = 3;
  
  // Navigation patterns
  NavigationPatterns patterns = 4;
  
  // Keyboard indicators
  KeyboardIndicators indicators = 5;
}

// Tab order configuration
message TabOrder {
  // Logical tab order
  bool enforce_logical = 1;
  
  // Skip hidden elements
  bool skip_hidden = 2;
  
  // Tab index management
  TabIndexManagement tab_index = 3;
  
  // Tab order visualization
  bool show_visualization = 4;
}

// Tab index management
message TabIndexManagement {
  // Remove positive tabindex
  bool remove_positive = 1;
  
  // Interactive elements only
  bool interactive_only = 2;
  
  // Custom tab stops
  repeated string custom_stops = 3;
}

// Keyboard shortcuts configuration
message KeyboardShortcuts {
  // Enable shortcuts
  bool enabled = 1;
  
  // Shortcut list
  repeated Shortcut shortcuts = 2;
  
  // Conflict detection
  bool detect_conflicts = 3;
  
  // Help dialog
  bool show_help = 4;
  
  // Help key
  string help_key = 5;
}

// Individual shortcut
message Shortcut {
  // Shortcut key combination
  string key = 1;
  
  // Action description
  string action = 2;
  
  // Context (global, form, etc.)
  string context = 3;
  
  // Customizable
  bool customizable = 4;
}

// Navigation patterns
message NavigationPatterns {
  // Arrow key navigation
  ArrowNavigation arrows = 1;
  
  // Home/End key support
  bool home_end_support = 2;
  
  // Page Up/Down support
  bool page_support = 3;
  
  // Escape key handling
  bool escape_handling = 4;
  
  // Enter key behavior
  string enter_behavior = 5;
}

// Arrow navigation configuration
message ArrowNavigation {
  // Enable arrow navigation
  bool enabled = 1;
  
  // Navigation contexts
  repeated ArrowContext contexts = 2;
  
  // Wrap around
  bool wrap_around = 3;
}

// Arrow navigation context
message ArrowContext {
  // Context name (menu, grid, etc.)
  string name = 1;
  
  // CSS selector
  string selector = 2;
  
  // Navigation type
  ArrowNavigationType type = 3;
}

// Arrow navigation types
enum ArrowNavigationType {
  ARROW_NAVIGATION_TYPE_UNSPECIFIED = 0;
  ARROW_NAVIGATION_TYPE_HORIZONTAL = 1;
  ARROW_NAVIGATION_TYPE_VERTICAL = 2;
  ARROW_NAVIGATION_TYPE_GRID = 3;
  ARROW_NAVIGATION_TYPE_TREE = 4;
}

// Keyboard indicators
message KeyboardIndicators {
  // Show focus indicators
  bool show_focus = 1;
  
  // Focus style
  FocusStyle focus_style = 2;
  
  // Skip link indicators
  bool skip_indicators = 3;
  
  // Active element indication
  bool active_indication = 4;
}

// Focus style configuration
message FocusStyle {
  // Outline width
  int32 outline_width = 1;
  
  // Outline color
  string outline_color = 2;
  
  // Outline offset
  int32 outline_offset = 3;
  
  // Custom CSS
  string custom_css = 4;
}

// Focus management configuration
message FocusManagement {
  // Focus trap zones
  repeated FocusTrap focus_traps = 1;
  
  // Focus restoration
  FocusRestoration restoration = 2;
  
  // Focus order
  FocusOrder order = 3;
  
  // Focus announcements
  FocusAnnouncements announcements = 4;
}

// Focus trap configuration
message FocusTrap {
  // Trap identifier
  string id = 1;
  
  // CSS selector
  string selector = 2;
  
  // Initial focus
  string initial_focus = 3;
  
  // Return focus on close
  bool return_focus = 4;
  
  // Allow escape
  bool allow_escape = 5;
}

// Focus restoration configuration
message FocusRestoration {
  // Enable restoration
  bool enabled = 1;
  
  // Save focus on navigation
  bool save_on_navigation = 2;
  
  // Restore on back
  bool restore_on_back = 3;
  
  // Focus memory duration
  int32 memory_duration_ms = 4;
}

// Focus order configuration
message FocusOrder {
  // Reading order matches focus
  bool match_reading_order = 1;
  
  // Group related elements
  bool group_related = 2;
  
  // Focus regions
  repeated FocusRegion regions = 3;
}

// Focus region
message FocusRegion {
  // Region name
  string name = 1;
  
  // CSS selector
  string selector = 2;
  
  // Tab behavior
  string tab_behavior = 3;
}

// Focus announcements
message FocusAnnouncements {
  // Announce focus changes
  bool enabled = 1;
  
  // Context announcements
  bool announce_context = 2;
  
  // Landmark announcements
  bool announce_landmarks = 3;
  
  // Custom announcements
  map<string, string> custom = 4;
}

// Visual accessibility settings
message VisualAccessibility {
  // Color contrast
  ColorContrast contrast = 1;
  
  // Text scaling
  TextScaling scaling = 2;
  
  // Motion and animation
  MotionSettings motion = 3;
  
  // Images and media
  ImagesMedia images = 4;
  
  // Visual indicators
  VisualIndicators indicators = 5;
}

// Color contrast configuration
message ColorContrast {
  // Minimum contrast ratios
  ContrastRatios ratios = 1;
  
  // High contrast mode
  HighContrastMode high_contrast = 2;
  
  // Color blind friendly
  ColorBlindSupport color_blind = 3;
  
  // Contrast checking
  bool enable_checking = 4;
}

// Contrast ratio requirements
message ContrastRatios {
  // Normal text (AA: 4.5:1)
  float normal_text = 1;
  
  // Large text (AA: 3:1)
  float large_text = 2;
  
  // UI components (3:1)
  float ui_components = 3;
  
  // Enhanced ratios (AAA)
  bool use_enhanced = 4;
}

// High contrast mode
message HighContrastMode {
  // Enable high contrast
  bool enabled = 1;
  
  // Auto-detect system setting
  bool auto_detect = 2;
  
  // Toggle button
  bool show_toggle = 3;
  
  // Custom schemes
  repeated ContrastScheme schemes = 4;
}

// Contrast scheme
message ContrastScheme {
  // Scheme name
  string name = 1;
  
  // Background color
  string background = 2;
  
  // Foreground color
  string foreground = 3;
  
  // Accent color
  string accent = 4;
}

// Color blind support
message ColorBlindSupport {
  // Enable support
  bool enabled = 1;
  
  // Safe color palette
  bool use_safe_palette = 2;
  
  // Pattern alternatives
  bool use_patterns = 3;
  
  // Color filters
  repeated ColorFilter filters = 4;
}

// Color filter
message ColorFilter {
  // Filter name
  string name = 1;
  
  // Filter type
  ColorFilterType type = 2;
  
  // CSS filter
  string css_filter = 3;
}

// Color filter types
enum ColorFilterType {
  COLOR_FILTER_TYPE_UNSPECIFIED = 0;
  COLOR_FILTER_TYPE_PROTANOPIA = 1;
  COLOR_FILTER_TYPE_DEUTERANOPIA = 2;
  COLOR_FILTER_TYPE_TRITANOPIA = 3;
  COLOR_FILTER_TYPE_ACHROMATOPSIA = 4;
}

// Text scaling configuration
message TextScaling {
  // Enable text scaling
  bool enabled = 1;
  
  // Scaling controls
  ScalingControls controls = 2;
  
  // Responsive sizing
  bool responsive_sizing = 3;
  
  // Line height scaling
  bool scale_line_height = 4;
  
  // Maximum scale
  float max_scale = 5;
}

// Scaling controls
message ScalingControls {
  // Show controls
  bool show_controls = 1;
  
  // Control position
  string position = 2;
  
  // Scaling steps
  repeated float steps = 3;
  
  // Remember preference
  bool remember = 4;
}

// Motion settings
message MotionSettings {
  // Respect prefers-reduced-motion
  bool respect_preference = 1;
  
  // Animation controls
  AnimationControls controls = 2;
  
  // Auto-play prevention
  bool prevent_autoplay = 3;
  
  // Parallax effects
  bool disable_parallax = 4;
  
  // Smooth scrolling
  bool optional_smooth_scroll = 5;
}

// Animation controls
message AnimationControls {
  // Pause animations
  bool allow_pause = 1;
  
  // Animation speed
  bool speed_control = 2;
  
  // Disable all animations
  bool disable_option = 3;
}

// Images and media configuration
message ImagesMedia {
  // Alt text requirements
  AltTextRequirements alt_text = 1;
  
  // Image descriptions
  bool long_descriptions = 2;
  
  // Decorative images
  DecorativeImages decorative = 3;
  
  // Complex images
  ComplexImages complex = 4;
}

// Alt text requirements
message AltTextRequirements {
  // Require alt text
  bool required = 1;
  
  // Minimum length
  int32 min_length = 2;
  
  // Maximum length
  int32 max_length = 3;
  
  // Quality checking
  bool quality_check = 4;
  
  // Empty alt for decorative
  bool empty_for_decorative = 5;
}

// Decorative images handling
message DecorativeImages {
  // Mark as decorative
  bool allow_marking = 1;
  
  // Auto-detect decorative
  bool auto_detect = 2;
  
  // Hide from screen readers
  bool hide_from_sr = 3;
}

// Complex images handling
message ComplexImages {
  // Require descriptions
  bool require_description = 1;
  
  // Description format
  string description_format = 2;
  
  // Link to description
  bool link_to_description = 3;
}

// Visual indicators
message VisualIndicators {
  // Loading indicators
  LoadingIndicators loading = 1;
  
  // Error indicators
  ErrorIndicators errors = 2;
  
  // Success indicators
  SuccessIndicators success = 3;
  
  // Progress indicators
  ProgressIndicators progress = 4;
}

// Loading indicators
message LoadingIndicators {
  // Show loading state
  bool show_loading = 1;
  
  // Loading text
  string loading_text = 2;
  
  // Spinner alternative
  bool text_alternative = 3;
}

// Error indicators
message ErrorIndicators {
  // Use icons with text
  bool icons_with_text = 1;
  
  // Color coding only
  bool avoid_color_only = 2;
  
  // Error patterns
  bool use_patterns = 3;
