  // Captions and subtitles
  CaptionsSubtitles captions = 1;
  
  // Audio descriptions
  AudioDescriptions descriptions = 2;
  
  // Volume controls
  VolumeControls volume = 3;
  
  // Transcripts
  Transcripts transcripts = 4;
}

// Captions and subtitles
message CaptionsSubtitles {
  // Provide captions
  bool provide_captions = 1;
  
  // Auto-generate captions
  bool auto_generate = 2;
  
  // Caption controls
  bool show_controls = 3;
  
  // Multiple languages
  bool multi_language = 4;
}

// Audio descriptions
message AudioDescriptions {
  // Provide descriptions
  bool provide_descriptions = 1;
  
  // Description track
  bool separate_track = 2;
  
  // Inline descriptions
  bool inline_descriptions = 3;
}

// Volume controls
message VolumeControls {
  // Show volume controls
  bool show_controls = 1;
  
  // Keyboard control
  bool keyboard_control = 2;
  
  // Remember volume
  bool remember_preference = 3;
}

// Transcripts
message Transcripts {
  // Provide transcripts
  bool provide_transcripts = 1;
  
  // Interactive transcripts
  bool interactive = 2;
  
  // Download option
  bool allow_download = 3;
}

// Content accessibility settings
message ContentAccessibility {
  // Reading level
  ReadingLevel reading = 1;
  
  // Content structure
  ContentStructure structure = 2;
  
  // Language support
  LanguageSupport language = 3;
  
  // Abbreviations and acronyms
  AbbreviationsAcronyms abbreviations = 4;
}

// Reading level configuration
message ReadingLevel {
  // Target reading level
  string target_level = 1;
  
  // Provide summaries
  bool provide_summaries = 2;
  
  // Glossary support
  bool glossary = 3;
  
  // Simplified version
  bool simplified_version = 4;
}

// Content structure
message ContentStructure {
  // Use semantic HTML
  bool semantic_html = 1;
  
  // Logical flow
  bool logical_flow = 2;
  
  // Consistent layout
  bool consistent_layout = 3;
  
  // Clear hierarchy
  bool clear_hierarchy = 4;
}

// Language support
message LanguageSupport {
  // Language switching
  bool language_switching = 1;
  
  // Translation availability
  bool translations = 2;
  
  // RTL support
  bool rtl_support = 3;
  
  // Language identification
  bool identify_language = 4;
}

// Abbreviations and acronyms
