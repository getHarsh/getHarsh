// =============================================================================
// CONTENT TYPE MAPPINGS
// =============================================================================

// Maps ContentType enum values to Schema.org Article subtypes
message ContentTypeMappings {
  // Simple string mapping: enum name -> Schema.org type
  // e.g., "CONTENT_TYPE_TUTORIAL" -> "HowToArticle"
  map<string, string> content_to_schema = 1;
}

message ContentTypeMapping {
  // Schema.org Article subtype
  string schema_type = 1;
  
  // Required properties for this content type
  repeated string required_properties = 2;
  
  // Typical word count range
  WordCountRange word_count = 3;
  
  // Default article section
  string default_section = 4;
}

message WordCountRange {
  int32 min = 1;
  int32 max = 2;
}

// Predefined content type mappings
message ContentTypeDefaults {
  // CONTENT_TYPE_ARTICLE
  ContentTypeMapping article = 1;
  // schema_type: "Article"
  // required_properties: ["headline", "datePublished", "author"]
  
  // CONTENT_TYPE_UPDATE
  ContentTypeMapping update = 2;
  // schema_type: "NewsArticle"
  // required_properties: ["headline", "datePublished", "dateline"]
  // default_section: "Updates"
  
  // CONTENT_TYPE_RESEARCH
  ContentTypeMapping research = 3;
  // schema_type: "ScholarlyArticle"
  // required_properties: ["headline", "datePublished", "author", "abstract"]
  // word_count: { min: 2000, max: 10000 }
  
  // CONTENT_TYPE_CASE_STUDY
  ContentTypeMapping case_study = 4;
  // schema_type: "TechArticle"
  // required_properties: ["headline", "datePublished", "author", "about"]
  
  // CONTENT_TYPE_ANNOUNCEMENT
  ContentTypeMapping announcement = 5;
  // schema_type: "NewsArticle"
  // default_section: "Announcements"
}

