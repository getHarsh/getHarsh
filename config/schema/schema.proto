syntax = "proto3";

package website.config;

option go_package = "github.com/getHarsh/getHarsh/config";

// =============================================================================
// SCHEMA.ORG MAPPING DEFINITIONS
// =============================================================================
// This file defines the STRUCTURE for Schema.org mappings in the ecosystem.
// The actual mapping values are stored in schema-mappings.yml.
//
// How it works:
// 1. Proto files define message structures (this file)
// 2. schema-mappings.yml contains the actual enum-to-Schema.org mappings
// 3. Config files use enums (e.g., CONTENT_TYPE_TUTORIAL)
// 4. Build system reads schema-mappings.yml and applies mappings automatically
// 5. Generates proper Schema.org JSON-LD structured data
//
// Benefits:
// - Type-safe enum usage in configs
// - Automatic Schema.org mapping (no manual configuration needed)
// - Single source of truth (schema-mappings.yml)
// - Safe by default - configs can only use valid enums
//
// See: schema-mappings.yml for the complete mapping dictionary
// =============================================================================

// Complete Schema.org mapping configuration for the ecosystem
message SchemaOrgMappings {
  // All enum mappings organized by type
  DiscussionPlatformMappings discussion_platforms = 1;
  MediaTypeMappings media_types = 2;
  ContentTypeMappings content_types = 3;
  PaymentMethodMappings payment_methods = 4;
  CodeLanguageMappings code_languages = 5;
  CryptoNetworkMappings crypto_networks = 6;
  
  // Entity and relationship mappings
  AffiliationTypeMappings affiliation_types = 7;
  RelationshipTypeMappings relationship_types = 8;
  SchemaOrgEntityTypeMappings schema_org_entity_types = 9;
  EntityTypeMappings entity_types = 10;
  
  // Project-related mappings
  ProjectTypeMappings project_types = 11;
  ProjectStatusMappings project_statuses = 12;
  ProjectLifecycleMappings project_lifecycles = 13;
  LicenseTypeMappings license_types = 14;
  
  // Support and dependency mappings
  SupportTypeMappings support_types = 15;
  DependencyTypeMappings dependency_types = 16;
  DependencyScopeMappings dependency_scopes = 17;
  
  // Community and API mappings
  CommunityStatusMappings community_statuses = 18;
  APISpecFormatMappings api_spec_formats = 19;
  AuthTypeMappings auth_types = 20;
  
  // Documentation and UI mappings
  DocNavigationStyleMappings doc_navigation_styles = 21;
  DocLandingStyleMappings doc_landing_styles = 22;
  SidebarPositionMappings sidebar_positions = 23;
  LinkBehaviorMappings link_behaviors = 24;
  APIDocGeneratorMappings api_doc_generators = 25;
  OAuth2FlowMappings oauth2_flows = 26;
  
  // Project UI mappings
  HomepageStyleMappings homepage_styles = 27;
  DocsLayoutStyleMappings docs_layout_styles = 28;
  PlaygroundProviderMappings playground_providers = 29;
  SearchProviderMappings search_providers = 30;
  
  // Manifest mappings
  ManifestFormatMappings manifest_formats = 31;
  SiteTypeMappings site_types = 32;
  NodeTypeMappings node_types = 33;
  
  // New content and service mappings
  ServiceTypeMappings service_types = 34;
  ProjectDevelopmentStatusMappings project_development_statuses = 35;
  ComicTypeMappings comic_types = 36;
  BookStructureMappings book_structures = 37;
  
  // Person role mappings
  PersonRoleMappings person_roles = 38;
  
  // Global mapping configuration
  MappingConfig config = 39;
}

// Global configuration for Schema.org mapping behavior
message MappingConfig {
  // Default context URL
  string default_context = 1; // "https://schema.org"
  
  // Enable rich snippets
  bool enable_rich_snippets = 2;
  
  // Include @id references
  bool include_id_references = 3;
  
  // Validation level ("strict", "lenient")
  string validation_level = 4;
}

// =============================================================================
// DISCUSSION PLATFORM MAPPINGS
// =============================================================================

// Maps DiscussionPlatform enum values to Schema.org types
message DiscussionPlatformMappings {
  // Simple string mapping: enum name -> Schema.org type
  // e.g., "DISCUSSION_PLATFORM_TWITTER" -> "SocialMediaPosting"
  map<string, string> platform_to_schema = 1;
}

message DiscussionPlatformMapping {
  // Schema.org type
  string schema_type = 1;
  
  // Additional types
  repeated string additional_types = 2;
  
  // Platform provider
  Provider provider = 3;
  
  // URL pattern for linking
  string url_pattern = 4;
  
  // Interaction type
  string interaction_type = 5;
  
  // Platform-specific properties
  map<string, string> properties = 6;
}

// Provider information
message Provider {
  string type = 1;          // "Organization"
  string name = 2;          // "GitHub"
  string url = 3;           // "https://github.com"
  string same_as = 4;       // Wikipedia URL
}

