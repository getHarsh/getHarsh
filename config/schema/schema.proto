// =============================================================================
// CRYPTO NETWORK MAPPINGS
// =============================================================================

// Maps CryptoNetwork enum values to Schema.org currency representations
message CryptoNetworkMappings {
  // Simple string mapping: enum name -> currency code
  // e.g., "CRYPTO_NETWORK_BITCOIN" -> "BTC"
  map<string, string> crypto_to_code = 1;
}

message CryptoNetworkMapping {
  // Currency ticker symbol
  string ticker = 1;
  
  // Full currency name
  string name = 2;
  
  // Currency type
  string currency_type = 3;
  
  // Blockchain info
  BlockchainInfo blockchain = 4;
  
  // Schema.org representation
  string schema_currency_code = 5;
}

message BlockchainInfo {
  string name = 1;
  string explorer_url = 2;
  string network_type = 3; // "mainnet", "layer2", etc.
}

// Predefined crypto network mappings
message CryptoNetworkDefaults {
  // CRYPTO_NETWORK_BITCOIN
  CryptoNetworkMapping bitcoin = 1;
  // ticker: "BTC"
  // name: "Bitcoin"
  // currency_type: "Cryptocurrency"
  // blockchain: { name: "Bitcoin", explorer_url: "https://blockchain.info" }
  // schema_currency_code: "BTC"
  
  // CRYPTO_NETWORK_ETHEREUM
  CryptoNetworkMapping ethereum = 2;
  // ticker: "ETH"
  // name: "Ethereum"
  // currency_type: "Cryptocurrency"
  // blockchain: { name: "Ethereum", explorer_url: "https://etherscan.io" }
  // schema_currency_code: "ETH"
  
  // CRYPTO_NETWORK_USDT
  CryptoNetworkMapping usdt = 3;
  // ticker: "USDT"
  // name: "Tether"
  // currency_type: "Stablecoin"
  // blockchain: { name: "Multiple", network_type: "multi-chain" }
  // schema_currency_code: "USDT"
}

