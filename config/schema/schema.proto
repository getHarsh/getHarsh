// =============================================================================
// BUILD SYSTEM INTEGRATION
// =============================================================================

// Configuration for build-time processing
message BuildSystemConfig {
  // Enable automatic JSON-LD generation
  bool auto_generate_jsonld = 1;
  
  // Output directory for generated Schema.org files
  string output_directory = 2;
  
  // Validation settings
  ValidationConfig validation = 3;
  
  // Transformation rules
  repeated TransformationRule transformation_rules = 4;
}

// Validation configuration
message ValidationConfig {
  // Validate against Schema.org vocabulary
  bool validate_schema_org = 1;
  
  // Validate required properties
  bool validate_required_properties = 2;
  
  // Fail build on validation errors
  bool fail_on_error = 3;
  
  // Schema.org validator URL
  string validator_url = 4;
}

// Transformation rule for build system
message TransformationRule {
  // Source enum type
  string enum_type = 1;
  
  // Target Schema.org context
  string target_context = 2;
  
  // Custom transformation function (if needed)
  string transform_function = 3;
  
  // Apply to specific fields only
  repeated string apply_to_fields = 4;
}

