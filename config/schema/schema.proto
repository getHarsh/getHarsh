message LinkBehaviorMappings {
  // Simple string mapping: enum name -> target attribute
  // e.g., "LINK_BEHAVIOR_NEW_TAB" -> "_blank"
  map<string, string> behavior_to_target = 1;
}

message LinkBehaviorMapping {
  // Target attribute
  string target = 1;
  
  // Rel attribute
  string rel = 2;
  
  // Security attributes
  map<string, string> security_attrs = 3;
}

