syntax = "proto3";

package website.config;

import "ecosystem.proto";
import "schema.proto";
import "gtm.proto";
import "aria.proto";

option go_package = "github.com/getHarsh/getHarsh/config";

// =============================================================================
// DOMAIN CONFIGURATION PROTO
// =============================================================================
// Defines configuration for root domains (e.g., getHarsh.in, causality.in).
// Inherits all defaults from ecosystem.proto and can override/extend them.
//
// Key Features:
// - Schema.org entity definition for the domain
// - Page-level schema configuration
// - Policy page overrides with granular control
// - Theme, visual effects, and feature configuration
//
// Related Documentation:
// - Implementation Examples: ../SCHEMA-ORG-EXAMPLES.md#configuration-examples
// - Inheritance Rules: ../SCHEMA-ORG-EXAMPLES.md#inheritance--overrides
// - Configuration Guide: ../CONFIG.md
// =============================================================================

// DomainConfig defines the configuration for a root domain (e.g., getHarsh.in).
// It inherits from EcosystemConfig and adds domain-specific settings.
// Stored in [domain].in/config.yml
message DomainConfig {
  // Inherits all fields from ecosystem config (implicit in build system)
  // The build system will merge ecosystem defaults before applying domain config
  
  // Basic domain information (REQUIRED)
  DomainInfo domain_info = 1;
  
  // Contact email addresses (REQUIRED)
  ContactEmails contact = 2;
  
  // Theme configuration for the root site (REQUIRED: at least primary color)
  Theme theme = 3;
  
  // Social media accounts
  SocialMedia social = 4;
  
  // Domain-specific features
  DomainFeatures features = 5;
  
  // Navigation display strings (e.g., "Connect" for contact, "Thoughts" for blog)
  NavigationLabels nav_labels = 6;
  
  // Cross-site navigation overrides
  CrossSiteNav cross_site = 7;
  
  // Blog subdomain reference
  BlogSubdomain blog = 8;
  
  // Progressive Web App settings (optional)
  PWASettings pwa_settings = 9;
  
  // Sponsor settings for domain
  DomainSponsorSettings sponsor = 10;
  
  // Domain-specific structured data overrides
  DomainStructuredData structured_data_overrides = 11;
  
  // Projects page layout configuration
  ProjectsPageSettings projects_page = 12;
  
  // Error page custom messages
  ErrorPageSettings error_pages = 13;
  
  // Policy page template variables
  PolicySettings policy_settings = 14;
  
  // Domain-level policy page overrides
  // Allows enabling/disabling specific policies and custom URLs
  // See ../SCHEMA-ORG-EXAMPLES.md#policy-inheritance
  PolicyOverrides policy_overrides = 15;
  
  // Schema.org entity configuration for this domain
  // Defines the semantic type (Person, Organization, ResearchProject, etc.)
  // See ../SCHEMA-ORG-EXAMPLES.md#configuration-examples
  SchemaOrgEntity schema_org_entity = 16;
  
  // Page-level Schema.org configuration
  // Maps page paths to their semantic types (e.g., /projects → CollectionPage)
  // See ../SCHEMA-ORG-EXAMPLES.md#page-level-schemas
  map<string, SchemaOrgEntity> pages_schema = 17;
  
  // Schema.org mapping configuration for this domain
  // Inherits from ecosystem but can override
  SchemaOrgDomainConfig schema_org_config = 18;
  
  // Breadcrumb navigation configuration
  // Maps to Schema.org BreadcrumbList
  BreadcrumbConfig breadcrumb_config = 19;
  
  // Domain-specific Schema.org extensions
  SchemaOrgExtensions schema_extensions = 20;
  
  // Navigation configuration with CTAs and menu items
  NavigationConfig navigation_config = 21;
  
  // Google Tag Manager configuration
  // Provides foundation for analytics and conversion tracking
  website.config.gtm.GTMConfig gtm_config = 22;
  
  // ARIA accessibility configuration
  // Ensures WCAG 2.1 AA compliance across all pages
  website.config.aria.ARIAConfig aria_config = 23;
}

// Basic domain information
message DomainInfo {
  // Domain name (e.g., "getHarsh.in") - REQUIRED
  string domain = 1;
  
  // Site title (e.g., "getHarsh") - REQUIRED
  string title = 2;
  
  // Site description - REQUIRED
  string description = 3;
  
  // Legal entity key from ecosystem catalog (e.g., "RTEPL", "DSPL") - REQUIRED
  // References ecosystem.legal_entities map
  string entity_key = 4;
  
  // Primary language code (e.g., "en")
  string language = 5;
  
  // Domain aliases (other domains that point to this same content)
  // These become Schema.org sameAs URLs
  // Examples: ["getHarsh.com", "getHarsh.dev", "getharsh.online"]
  repeated string domain_aliases = 6;
}

// Contact email configuration
message ContactEmails {
  // General information email - REQUIRED
  string info = 1;
  
  // Business proposals email - REQUIRED
  string proposal = 2;
  
  // Accounts/billing email - REQUIRED
  string accounts = 3;
  
  // Technical support email (optional)
  string support = 4;
  
  // Legal/compliance email (optional)
  string legal = 5;
  
  // Sponsorship/funding email (optional)
  string sponsorship = 6;
  
  // Media/press inquiries email (optional)
  string media = 7;
  
  // Partnership inquiries email (optional)
  string partnership = 8;
  
  // Careers/HR email (optional)
  string careers = 9;
  
  // Appointment booking settings
  // Maps to Schema.org ScheduleAction
  AppointmentSettings appointment_booking = 10;
}

// Theme configuration for the root site
message Theme {
  // Theme identifier ("getharsh", "rawthoughts", "daostudio", "causality", "sleepwalker")
  string theme_id = 1;
  
  // Dark mode support
  ThemeMode theme_mode = 2;
  
  // Accessibility settings
  AccessibilitySettings accessibility = 3;
}



// Social media configuration
message SocialMedia {
  // Twitter/X handle (without @)
  string twitter = 1;
  
  // GitHub username
  string github = 2;
  
  // LinkedIn profile URL
  string linkedin = 3;
  
  // Instagram handle
  string instagram = 4;
  
  // YouTube channel URL
  string youtube = 5;
  
  // Reddit username (without u/)
  string reddit = 6;
  
  // Discord server invite or username
  string discord = 7;
  
  // Custom social links for other platforms
  map<string, string> custom = 8;
}

// Domain-specific features
message DomainFeatures {
  // Enable portfolio/projects section
  bool portfolio = 1;
  
  // Enable contact form
  bool contact_form = 2;
  
  // Enable newsletter signup
  bool newsletter = 3;
  
  // Enable services pages (requires config_services.yml)
  bool services_enabled = 4;
  
  // Custom features specific to this domain
  map<string, bool> custom = 5;
}

// Navigation display labels
message NavigationLabels {
  // Display string for contact page (default: "Connect")
  string contact = 1;
  
  // Display string for about page (default: "About")
  string about = 2;
  
  // Display string for home/index (default: "Home")
  string home = 3;
  
  // Note: Blog display string is in BlogSubdomain.display_string
  // Note: Projects display string is in ProjectsPageSettings.display_string
}

// Cross-site navigation configuration
message CrossSiteNav {
  // Show link to blog subdomain
  bool show_blog_link = 1;
  
  // Show ecosystem navigation
  bool show_ecosystem_nav = 2;
  
  // Counterpart site (e.g., sleepwalker.in for causality.in)
  string counterpart_site = 3;
}

// Blog subdomain reference
message BlogSubdomain {
  // Blog exists for this domain
  bool enabled = 1;
  
  // Display string for blog links (default: "Thoughts")
  // This is how the blog is referenced in navigation and CTAs
  string display_string = 2;
  
  // Note: Actual blog configuration lives in blog.[domain].in/config.yml
  // The blog is a separate repository with its own settings
}

// Dark mode configuration
message ThemeMode {
  // Enable dark mode feature
  bool enable_dark_mode = 1;
  
  // Default mode when user first visits ("light", "dark", "system")
  string default_mode = 2;
  
  // Show mode toggle button in UI
  bool show_mode_toggle = 3;
  
  // Store user preference in localStorage
  bool remember_preference = 4;
}

// Accessibility settings for improved user experience
message AccessibilitySettings {
  // Enable high contrast mode option
  bool high_contrast_mode = 1;
  
  // Always show focus indicators
  bool focus_indicators = 2;
  
  // Enable skip navigation links
  bool skip_navigation = 3;
  
  // ARIA label prefix for dynamic content
  string aria_label_prefix = 4;
  
  // Respect prefers-reduced-motion
  bool reduce_motion = 5;
  
  // Enable keyboard navigation hints
  bool keyboard_hints = 6;
  
  // Font size adjustment controls
  bool font_size_controls = 7;
  
  // Alt text for all images (enforcement)
  bool require_alt_text = 8;
  
  // Screen reader optimizations
  bool screen_reader_optimizations = 9;
}

// Progressive Web App configuration
message PWASettings {
  // Enable PWA features
  bool enable_pwa = 1;
  
  // App name for manifest
  string app_name = 2;
  
  // Short name for home screen
  string short_name = 3;
  
  // Start URL when launched from home screen
  string start_url = 4;
  
  // Display mode
  string display = 5; // "standalone", "fullscreen", "minimal-ui", "browser"
  
  // App icons configuration
  repeated PWAIcon icons = 6;
  
  // Note: Offline pages are handled by standard logic:
  // - Domains: /, /about, /contact, /projects (if enabled)
  // - Blogs: / only
  // - Individual articles: Save button for user-initiated offline storage
}

// PWA icon configuration
message PWAIcon {
  // Icon source path
  string src = 1;
  
  // Icon sizes (e.g., "192x192")
  string sizes = 2;
  
  // Icon MIME type
  string type = 3;
  
  // Icon purpose ("any", "maskable", "monochrome")
  string purpose = 4;
}

// Sponsor settings configuration for domains
message DomainSponsorSettings {
  // Enable sponsor functionality
  bool enabled = 1;
  
  // Payment links configuration
  PaymentLinks payment_links = 2;
  
  // Sponsor email template settings
  EmailTemplate sponsor_email_template = 3;
  
  // Sponsor disclosure settings
  SponsorDisclosure disclosure = 4;
  
  // Sponsored content guidelines URL
  string guidelines_url = 5;
}

// Payment links for sponsorship
message PaymentLinks {
  // PayPal donation link
  string paypal = 1;
  
  // GitHub Sponsors profile (auto-generated from social.github if not provided)
  string github_sponsors = 2;
  
  // Patreon page
  string patreon = 3;
  
  // Buy Me a Coffee link
  string buymeacoffee = 4;
  
  // YouTube membership (auto-generated from social.youtube if not provided)
  string youtube_membership = 5;
  
  // Cryptocurrency wallets
  CryptoWallets crypto = 6;
  
  // Custom payment links (e.g., UPI, region-specific)
  map<string, string> custom = 7;
}

// Cryptocurrency wallet addresses
message CryptoWallets {
  // Bitcoin wallet address
  string bitcoin = 1;
  
  // Ethereum wallet address (supports ENS)
  string ethereum = 2;
  
  // Solana wallet address
  string solana = 3;
}

// Email template configuration
message EmailTemplate {
  // Subject line template
  string subject_template = 1;
  
  // Body template with variables
  string body_template = 2;
  
  // Available variables for templates
  repeated string available_variables = 3;
}

// Sponsor disclosure configuration
message SponsorDisclosure {
  // Default disclosure text
  string default_text = 1;
  
  // Position in article ("top", "bottom", "both")
  string position = 2;
  
  // Visual styling ("banner", "inline", "subtle")
  string style = 3;
  
  // Include sponsor logo
  bool include_logo = 4;
}

// Domain-specific structured data overrides
message DomainStructuredData {
  // Organization override for this domain
  OrganizationOverride organization_override = 1;
  
  // Domain-specific author keys (references ecosystem.authors)
  // Example: ["harsh", "john_doe"]
  repeated string domain_author_keys = 2;
  
  // Local business schema (if applicable)
  LocalBusinessSchema local_business = 3;
  
  // Service schema (if applicable)
  ServiceSchema service = 4;
  
  // Custom schema extensions
  map<string, string> custom_schemas = 5;
}

// Organization override for domain
message OrganizationOverride {
  // Override organization name
  string name_override = 1;
  
  // Additional same as URLs
  repeated string additional_same_as = 2;
  
  // Domain-specific contact point
  ContactPoint domain_contact = 3;
  
  // Domain-specific logo
  string domain_logo_url = 4;
}

// Local business schema
message LocalBusinessSchema {
  // Enable local business markup
  bool enabled = 1;
  
  // Business type (e.g., "ProfessionalService")
  string business_type = 2;
  
  // Physical address
  PostalAddress address = 3;
  
  // Business hours
  repeated OpeningHours opening_hours = 4;
  
  // Price range (e.g., "$$")
  string price_range = 5;
}

// Postal address for local business
message PostalAddress {
  // Street address
  string street_address = 1;
  
  // City/locality
  string locality = 2;
  
  // State/region
  string region = 3;
  
  // Postal code
  string postal_code = 4;
  
  // Country
  string country = 5;
}

// Opening hours specification
message OpeningHours {
  // Day of week
  string day_of_week = 1;
  
  // Opening time (24h format)
  string opens = 2;
  
  // Closing time (24h format)
  string closes = 3;
}

// Service schema for domain
message ServiceSchema {
  // Enable service markup
  bool enabled = 1;
  
  // Service type
  string service_type = 2;
  
  // Service description
  string description = 3;
  
  // Area served
  repeated string area_served = 4;
  
  // Available channels
  repeated string available_channel = 5;
}

// Projects page layout configuration
message ProjectsPageSettings {
  // Enable projects page
  bool enabled = 1;
  
  // Display string for projects page links (default: "Highlights")
  // This is how the projects page is referenced in navigation and CTAs
  string display_string = 2;
  
  // Layout style ("grid", "list", "showcase")
  string layout = 3;
  
  // Number of items per row (for grid layout)
  int32 items_per_row = 4;
  
  // Show tech stack on cards
  bool show_tech_stack = 5;
  
  // Show project status
  bool show_status = 6;
  
  // Show project description
  bool show_description = 7;
  
  // Enable filtering by status/tech
  bool enable_filtering = 8;
}

// Error page custom messages
message ErrorPageSettings {
  // Custom messages for each error code
  map<int32, string> error_messages = 1;  // e.g., 404 -> "Oops! Lost in the void..."
  
  // Show ecosystem learn more link
  bool show_ecosystem_link = 2;
  
  // Error page style ("quirky", "minimal", "technical")
  string style = 3;
  
  // Custom CTAs for error pages
  repeated string custom_ctas = 4;
}

// Policy page template variables
message PolicySettings {
  // Template variables for substitution
  map<string, string> template_variables = 1;  // e.g., "company_name" -> "RTEPL"
  
  // Auto-update year in copyright
  bool auto_update_year = 2;
  
  // Policy update notification settings
  PolicyUpdateNotification update_notification = 3;
  
  // Custom policy sections
  map<string, string> custom_sections = 4;
}

// Policy update notification configuration
message PolicyUpdateNotification {
  // Show last updated date
  bool show_last_updated = 1;
  
  // Highlight recent changes
  bool highlight_changes = 2;
  
  // Days to consider "recent"
  int32 recent_days_threshold = 3;
}

// Navigation configuration with menu items and CTAs
message NavigationConfig {
  // Primary navigation items
  repeated NavigationItem primary_nav = 1;
  
  // Footer navigation items
  repeated NavigationItem footer_nav = 2;
  
  // Hero section CTAs
  repeated CTAButton hero_ctas = 3;
  
  // Mobile menu items (if different from primary)
  repeated NavigationItem mobile_nav = 4;
  
  // Quick links for footer or sidebar
  repeated NavigationItem quick_links = 5;
}

// Individual navigation item
message NavigationItem {
  // Display label (e.g., "Home", "About", "Thoughts")
  string label = 1;
  
  // URL or path (e.g., "/", "/about", "/blog")
  string url = 2;
  
  // Opens in new tab/window
  bool external = 3;
  
  // Icon name (optional, for icon fonts or SVG)
  string icon = 4;
  
  // Show only when feature is enabled
  string required_feature = 5;
  
  // Display order (lower numbers first)
  int32 order = 6;
  
  // Additional CSS classes
  string css_class = 7;
}

// CTA button configuration
message CTAButton {
  // Button text (e.g., "Get Started", "Learn More")
  string label = 1;
  
  // Button URL or action
  string url = 2;
  
  // Button variant ("primary", "secondary", "ghost", "outline")
  string variant = 3;
  
  // Button size ("sm", "default", "lg")
  string size = 4;
  
  // Icon to display with button
  string icon = 5;
  
  // Track with analytics
  bool track_click = 6;
  
  // Analytics event name
  string event_name = 7;
  
  // Additional CSS classes
  string css_class = 8;
}

// Policy page overrides for domain/blog/project level control
// Provides granular control over which policies are shown and their URLs
// See ../SCHEMA-ORG-EXAMPLES.md#policy-inheritance for examples
message PolicyOverrides {
  // Enable/disable specific policy pages at this level
  // Example: {"privacy_policy": true, "refund_policy": false}
  map<string, bool> enabled_policies = 1;
  
  // Override policy URLs for this entity
  // Example: {"terms_of_service": "/custom-terms"}
  map<string, string> policy_urls = 2;
  
  // Custom policy pages unique to this entity
  // Example: {"api_terms": "/api/terms"} for API projects
  map<string, string> custom_policies = 3;
  
  // Hide policies from navigation/footer while keeping them accessible
  // Example: ["refund_policy", "dpa"] for non-commerce sites
  repeated string hidden_policies = 4;
  
  // Whether to inherit parent's policy configuration (default: true)
  // Set to false to completely override parent settings
  bool inherit_parent_policies = 5;
}

// Schema.org configuration specific to domains
message SchemaOrgDomainConfig {
  // Override ecosystem Schema.org config
  SchemaOrgConfig config_override = 1;
  
  // Domain-specific type mappings
  DomainTypeMappings type_mappings = 2;
  
  // Page type defaults
  PageTypeDefaults page_defaults = 3;
  
  // Organization markup settings
  OrganizationMarkupSettings org_settings = 4;
}

// Domain-specific type mappings
message DomainTypeMappings {
  // Default page type for unlisted pages
  SchemaOrgEntityType default_page_type = 1;
  
  // Mapping of URL patterns to Schema.org types
  map<string, string> url_pattern_types = 2;
  
  // Special page type mappings
  SpecialPageTypes special_pages = 3;
}

// Special page type configuration
message SpecialPageTypes {
  // Home page type (default: WebSite)
  string home_type = 1;
  
  // About page type (default: AboutPage)
  string about_type = 2;
  
  // Contact page type (default: ContactPage)
  string contact_type = 3;
  
  // Projects page type (default: CollectionPage)
  string projects_type = 4;
  
  // Blog listing type (default: Blog)
  string blog_type = 5;
  
  // Error pages type (default: WebPage)
  string error_type = 6;
}

// Page type defaults for Schema.org
message PageTypeDefaults {
  // Include author for all pages
  bool include_author = 1;
  
  // Include organization for all pages
  bool include_organization = 2;
  
  // Include breadcrumbs for all pages
  bool include_breadcrumbs = 3;
  
  // Include site search action
  bool include_site_search = 4;
  
  // Default image for pages without images
  string default_image_url = 5;
}

// Organization markup settings
message OrganizationMarkupSettings {
  // Use legal entity as organization
  bool use_legal_entity = 1;
  
  // Include founders in organization markup
  bool include_founders = 2;
  
  // Include all contact points
  bool include_all_contacts = 3;
  
  // Include social profiles
  bool include_social_profiles = 4;
  
  // Organization type override
  string organization_type = 5;
}

// Breadcrumb configuration
message BreadcrumbConfig {
  // Enable breadcrumbs
  bool enabled = 1;
  
  // Home page label
  string home_label = 2;
  
  // Separator character
  string separator = 3;
  
  // Include current page
  bool include_current = 4;
  
  // Schema.org markup
  bool schema_markup = 5;
}

// Schema.org extensions for domains
message SchemaOrgExtensions {
  // Custom @context URLs
  repeated string custom_contexts = 1;
  
  // Custom type definitions
  map<string, CustomTypeDefinition> custom_types = 2;
  
  // Property extensions
  map<string, string> property_extensions = 3;
  
  // Enable experimental features
  bool enable_experimental = 4;
}

// Custom type definition
message CustomTypeDefinition {
  // Base Schema.org type
  string extends_type = 1;
  
  // Custom properties
  map<string, PropertyDefinition> properties = 2;
  
  // Required properties
  repeated string required = 3;
}

// Property definition for custom types
message PropertyDefinition {
  // Property type
  string type = 1;
  
  // Property description
  string description = 2;
  
  // Expected Schema.org type
  string expected_type = 3;
  
  // Multiple values allowed
  bool multiple = 4;
}