# Component default settings
component_defaults:
  code_block:
    show_line_numbers: true
    show_copy_button: true
    default_theme: "github-dark"
    enable_line_highlighting: true
    tab_size: 2
  table_of_contents:
    min_headings: 3
    max_depth: 3
    position: "right"
    sticky: true
    smooth_scroll: true
    highlight_current: true
  social_share:
    platforms:
      - "twitter"
      - "linkedin"
      - "facebook"
      - "reddit"
    desktop_position: "right"
    show_counts: false
    sticky: true
    include_via: true
  audio_player:
    auto_play: false
    show_download: true
    preload: "metadata"
    default_volume: 0.8
  image:
    lazy_loading: true
    loading_animation: "blur"
    default_quality: 85
    enable_zoom: true
  video_embed:
    aspect_ratio: "16:9"
    privacy_mode: true
    show_controls: true
    lazy_loading: true
  # Enhanced code block settings for rich semantic traces
  enhanced_code_block:
    show_line_numbers: true
    show_copy_button: true
    theme: "github-dark"
    enable_line_highlighting: true
    tab_size: 2
    wrap_lines: false
    show_language_label: true
    enable_diff_view: true
    max_height: 600
    language_aliases:
      js: "javascript"
      ts: "typescript"
      py: "python"
      sh: "shell"
      yml: "yaml"
      proto: "protobuf"
    inline_highlighting: true
  # Technical content settings for research domains (causality.in)
  technical_content:
    enable_math: true  # Essential for causality.in research
    math_engine: "katex"
    enable_mermaid: true
    mermaid_theme: "neutral"
    enable_footnotes: true
    footnote_style: "numeric"
    enable_table_of_contents: true
    toc_max_depth: 3
    toc_position: "right"
    enable_citations: true
    citation_style: "ieee"
    enable_definitions: true
    enable_interactive: false  # Future: Enable when HENA integration ready
  # Responsive display rules for mobile-first approach
  responsive_rules:
    mobile_hidden:
      - "table-of-contents"
      - "social-share-sidebar"
      - "chip-details"
      - "sponsor-sidebar"
    tablet_only: []
    desktop_only:
      - "floating-toc"
      - "sponsor-recognition"
    breakpoints:
      mobile_max: 768
      tablet_min: 769
      tablet_max: 1024
      desktop_min: 1025
    component_rules:
      blog_index:
        mobile: true
        tablet: true
        desktop: true
        alternatives:
          mobile: "compact-list"
          desktop: "full-grid"
      appointment_booking:
        mobile: true  # Shows as link on mobile
        tablet: true  # Full embed on tablet
        desktop: true  # Full embed on desktop
        alternatives:
          mobile: "booking-link"
          desktop: "calendar-embed"
    responsive_images: true
    responsive_tables: true
    mobile_first: true
  # Error page content with Harsh's quirky style
  error_pages:
    error_messages:
      404:
        code: 404
        message: "Looks like this page wandered off into the digital void"
        explanation: "It happens to the best of us. Chaos, causality, entropy - sometimes pages just disappear into non-linear time."
        variations:
          - "This page is exploring non-linear time. Check back yesterday."
          - "404: Page not found. But in a parallel universe, it definitely exists."
          - "The page you seek has achieved semantic transcendence."
          - "Lost in the chaos? This page took an entropic detour."
        image_url: "/assets/errors/404-void.svg"
        tone: "playful"
      500:
        code: 500
        message: "Our servers are having an existential crisis"
        explanation: "We're talking them through it. Consciousness upload paused at 3.14%. The semantic traces are recalibrating."
        variations:
          - "Server error: Too much entropy, not enough causality."
          - "500: The engine is recalibrating its neural pathways."
          - "HENA detected an anomaly. Rebooting consciousness pipeline."
        image_url: "/assets/errors/500-crisis.svg"
        tone: "apologetic"
      503:
        code: 503
        message: "Taking a quick meditation break"
        explanation: "Back in a quantum moment. The infrastructure needs to process the semantic overload."
        variations:
          - "503: Synchronizing with the distributed consciousness."
          - "The virtual team members are in a standup. Back shortly."
        image_url: "/assets/errors/503-meditation.svg"
        tone: "playful"
    default_template: "Oops! {code} - {message}"
    learn_more_suffix: "#ecosystem"
    enable_quirky_messages: true
    rotation_strategy: "random"
    cta_buttons:
      - text: "Home"
        url: "/"
        style: "primary"
        icon: "home"
      - text: "Thoughts"
        url: "/blog"
        style: "secondary"
        icon: "thought"
      - text: "About"
        url: "/about"
        style: "ghost"
        icon: "info"
  # Social discussion settings for AI-era conversations
  social_discussion:
    enabled: true
    discussion_urls: {}  # Populated dynamically per article
    enabled_platforms:
      - DISCUSSION_PLATFORM_GITHUB_ISSUE
      - DISCUSSION_PLATFORM_GITHUB_GIST
      - DISCUSSION_PLATFORM_TWITTER_THREAD
      - DISCUSSION_PLATFORM_LINKEDIN_POST
      - DISCUSSION_PLATFORM_REDDIT_THREAD
      - DISCUSSION_PLATFORM_CHATGPT_CHAT      # New AI platforms
      - DISCUSSION_PLATFORM_CLAUDE_CHAT       # New AI platforms
      - DISCUSSION_PLATFORM_CLAUDE_ARTIFACT   # New AI platforms
      - DISCUSSION_PLATFORM_PERPLEXITY_THREAD # New AI platforms
    discussion_prompt: "Continue this neurodivergent conversation:"
    show_on_mobile: false  # Hidden on mobile for cleaner experience
    position: "bottom"
    group_by_platform_type: true
  # Smart link settings for semantic link detection
  smart_links:
    enabled: true
    auto_detect: true
    show_icons: true
    add_aria_labels: true
    patterns:
      google_docs:
        - "docs.google.com/document"
        - "drive.google.com/file"
      google_sheets:
        - "sheets.google.com"
        - "docs.google.com/spreadsheets"
      google_slides:
        - "docs.google.com/presentation"
      google_drive:
        - "drive.google.com"
      github_repo:
        - "github.com/[^/]+/[^/]+$"
      github_file:
        - "github.com/.*/blob/"
      github_issue:
        - "github.com/.*/issues/"
      github_pr:
        - "github.com/.*/pull/"
      file_extensions:
        pdf: "document"
        md: "markdown"
        ipynb: "notebook"
        proto: "schema"
        yaml: "config"
        json: "data"
    custom_types:
      ecosystem_domain:
        type: "internal"
        icon: "ecosystem"
        aria_label: "Link to {domain} in the getHarsh ecosystem"
        css_class: "ecosystem-link"
        schema_type: "WebPage"
      ai_chat:
        type: "ai-conversation"
        icon: "ai-chat"
        aria_label: "Continue in AI chat"
        css_class: "ai-chat-link"
        schema_type: "DiscussionForumPosting"
    ecosystem_domains:
      - "getharsh.in"
      - "causality.in"
      - "rawthoughts.in"
      - "sleepwalker.in"
      - "daostudio.in"
    external_new_tab: true
    external_nofollow: false  # We trust our external links

# Ecosystem learn more URL
ecosystem_learn_more_url: "https://github.com/getHarsh/getHarsh/blob/main/README.md"

# Decap CMS configuration
decap_cms:
  backend:
    name: "git-gateway"
    branch: "main"
    cms_label_prefix: "[CMS]"
  media_folder: "static/img"
  public_folder: "/img"
  editorial_workflow:
    enabled: true
    publish_mode: "editorial_workflow"
    preview_context: "${WEBSITE_URL}"
  collections:
    posts:
      name: "posts"
      label: "Blog Posts"
      folder: "../master_posts/posts"
      create: true
      slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
      preview_path: "blog/{{slug}}"
      editor:
        preview: true
        preview_styles:
          - "/admin/preview.css"
      summary: "{{title}} - {{date}}"
      sort:
        field: "date"
        direction: "desc"
      view_filters:
        - label: "Published"
          field: "draft"
          pattern: "false"
        - label: "Drafts"
          field: "draft"
          pattern: "true"
      view_groups:
        - label: "Year"
          field: "date"
        - label: "Author"
          field: "author"
    pages:
      name: "pages"
      label: "Domain Pages"
      folder: "../master_posts/pages"
      create: true
      slug: "{{fields.entity}}/{{slug}}"
      preview_path: "{{slug}}"
      editor:
        preview: true
      summary: "{{title}} - {{entity}}"
      sort:
        field: "title"
        direction: "asc"
  preview_styles:
    - "/admin/cms.css"
  custom_widgets:
    cross-posting:
      name: "cross-posting"
      type: "object"
      options:
        collapsed: "true"
    project-relationships:
      name: "project-relationships"
      type: "object"
      options:
        collapsed: "true"
  slug:
    encoding: "unicode"
    clean_accents: true
    sanitize_replacement: "-"
  default_fields:
    - name: "layout"
      label: "Layout"
      widget: "hidden"
      default_value: "post"
    - name: "date"
      label: "Date"
      widget: "datetime"
      required: true
    - name: "author"
      label: "Author"
      widget: "select"
      default_value: "harsh"
      hint: "Select the author from the catalog"
  gatsby_integration:
    enable_preview: true
    preview_update_delay: 300
    real_time_preview: true
    preview_templates_path: "/src/cms/preview-templates"
    widget_scripts:
      - "/admin/widgets/cross-posting.js"
      - "/admin/widgets/project-relationships.js"
    preview_styles:
      - "/src/styles/gatsby-preview.css"

