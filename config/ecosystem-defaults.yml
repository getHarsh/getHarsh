# Build and Gatsby configuration
build_settings:
  build_mode: "production"
  path_prefix: ""
  asset_prefix: ""
  flags:
    fast_refresh: true
    cache: true
    parallel: true
    verbose: false
  mdx:
    enabled: true
    extensions:
      - ".md"
      - ".mdx"
    remark_plugins:
      - "remark-gfm"
      - "remark-smartypants"
    rehype_plugins:
      - "rehype-slug"
      - "rehype-autolink-headings"
    gatsby_remark_plugins:
      - name: "gatsby-remark-images"
        options:
          maxWidth: "1200"
          quality: "90"
      - name: "gatsby-remark-prismjs"
        options:
          classPrefix: "language-"
          showLineNumbers: "true"
      - name: "gatsby-remark-copy-linked-files"
        options:
          destinationDir: "static"
      - name: "gatsby-remark-smartypants"
        options:
          dashes: "oldschool"

# Default theme settings inherited by all domains
theme_defaults:
  # Available themes in the Tailwind-based theme system
  available_themes:
    - "getharsh"      # Solar Plexus (Manipura) - Gold/Amber
    - "rawthoughts"   # Root + Sacral - Terra/Rose
    - "daostudio"     # Heart (Anahata) - Sage/Mint
    - "causality"     # Throat (Vishuddha) - Sky/Blue
    - "sleepwalker"   # Crown (Sahasrara) - Violet/Lavender
  
  # Theme mapping overrides (if domain should use different theme)
  theme_mapping: {}

# Security configuration and environment variable classification
security:
  env_vars:
    PUBLIC:
      variables:
        - SITE_URL
        - SITE_NAME
        - AUTHOR_NAME
    SENSITIVE:
      variables:
        - GA_TRACKING_ID
        - META_PIXEL_ID
        - TWITTER_PIXEL_ID
        - LINKEDIN_PARTNER_ID
        - LINKEDIN_CONVERSION_CONTACT
        - LINKEDIN_CONVERSION_DOWNLOAD
        - RTEPL_GTM_CONTAINER_ID
        - DSPL_GTM_CONTAINER_ID
        - TWITTER_SITE_TAG_ID
        - SENTRY_DSN
    SECRET:
      variables:
        - STRIPE_SECRET_KEY
        - GITHUB_TOKEN
        - AWS_SECRET_ACCESS_KEY

# Default feature flags for all domains (can be overridden)
features:
  comments: false
  math: false
  graphviz: false
  mermaid: false
  search: true
  reading_time: true
  share_buttons: true
  table_of_contents: true
  syntax_highlighting: true

# AI agent integration settings
ai_agent:
  enabled: true
  manifest_path: "/manifest.json"
  sitemap_path: "/sitemap.xml"
  robots_path: "/robots.txt"
  llms_txt_path: "/llms.txt"

# Copyright configuration
copyright:
  pattern: "© {year} {entity}. All rights reserved."
  start_year: 2019

# Default timezone for all sites
timezone: "Asia/Kolkata"

# Cookie consent configuration (LEGALLY REQUIRED for GA/FB Pixel)
consent_settings:
  # See: CONSENT-ARCHITECTURE.md#configuration-flow
  enable_consent_banner: true
  consent_cookie_name: "analytics_consent"
  consent_duration_days: 365
  google_consent_mode_v2: true
  banner_text: "We use cookies and similar technologies to analyze site usage and improve your experience. Some features may not work properly without cookies."
  accept_button_text: "Accept All"
  decline_button_text: "Decline All"
  privacy_policy_url: "/privacy"
  cookie_policy_url: "/cookies"
  
  # Regional consent defaults for client-side detection
  # See: CONSENT-ARCHITECTURE.md#regional-detection
  # Format: "REGION:default_state"
  region_defaults:
    - "EU:denied"       # GDPR requires explicit consent
    - "US-CA:denied"    # CCPA requires opt-in for sale of data
    - "IN:granted"      # India allows implied consent
    - "DEFAULT:granted" # Standard practice for other regions
  
  # Enable granular category control
  # See: CONSENT-ARCHITECTURE.md#granular-consent-ui
  enable_granular_control: true
  
  # Category configuration for granular consent
  # See: CONSENT-ARCHITECTURE.md#granular-consent-ui
  categories_config:
    analytics:
      title: "Analytics"
      description: "Website analytics and performance monitoring"
      providers:
        - "Google Analytics"
        - "Microsoft Clarity"
      required: false
      pre_selected: false
    marketing:
      title: "Marketing"
      description: "Personalized advertising and remarketing"
      providers:
        - "Meta Pixel"
        - "Twitter Pixel"
        - "LinkedIn Insight Tag"
      required: false
      pre_selected: false
    functional:
      title: "Functional"
      description: "Enhanced functionality and personalization"
      providers:
        - "YouTube"
        - "Google Calendar"
      required: false
      pre_selected: true
    necessary:
      title: "Necessary"
      description: "Essential for website operation"
      providers:
        - "Authentication"
        - "Security"
      required: true
      pre_selected: true
  
  # Google Consent Mode v2 configuration
  consent_mode_v2:
    ad_user_data_default: false
    ad_personalization_default: false
    implementation_mode: "advanced"
    enable_cookieless_pings: true
    enable_data_modeling: true
    wait_for_update_ms: 500
    # Legacy region-specific defaults (kept for compatibility)
    region_defaults:
      EU:
        region: "EU"
        analytics_storage: false
        ad_storage: false
        ad_user_data: false
        ad_personalization: false
      US:
        region: "US"
        analytics_storage: true
        ad_storage: true
        ad_user_data: true
        ad_personalization: true
  enable_cross_domain_consent: true
  consent_domains:
    - "getHarsh.in"
    - "causality.in"
    - "rawThoughts.in"
    - "sleepwalker.in"
    - "daostudio.in"
  banner_position: "bottom"
  banner_theme: "auto"
  settings_button_text: "Cookie Settings"
  save_preferences_text: "Save Preferences"
  consent_version: "1.0"
  show_consent_icon: true
  consent_categories:
    analytics:
      title: "Analytics Cookies"
      description: "Help us understand how visitors interact with our websites by collecting and reporting information anonymously."
      providers:
        - "Google Analytics"
        - "Microsoft Clarity"
      required: false
      pre_selected: false
    marketing:
      title: "Marketing Cookies"
      description: "Used to track visitors across websites to display ads that are relevant and engaging for individual users."
      providers:
        - "Meta Pixel"
        - "Twitter Pixel"
        - "LinkedIn Insight Tag"
      required: false
      pre_selected: false
    functional:
      title: "Functional Cookies"
      description: "Enable enhanced functionality and personalization, such as videos and live chats."
      providers:
        - "YouTube"
        - "Google Calendar"
      required: false
      pre_selected: true
    necessary:
      title: "Necessary Cookies"
      description: "Required for the website to function properly. These cookies cannot be disabled."
      providers:
        - "Consent Management"
        - "Security Features"
      required: true
      pre_selected: true
  # Legal entity specific configurations
  entity_specific:
    RTEPL:
      privacy_policy_url: "https://rawthoughts.in/privacy"
      cookie_policy_url: "https://rawthoughts.in/cookies"
      data_controller: "RawThoughts Enterprises Private Limited"
      data_controller_email: "privacy@rtepl.co.in"
      banner_text_override: ""
      gtm_container_id: "${RTEPL_GTM_CONTAINER_ID}"
    DSPL:
      privacy_policy_url: "https://daostudio.in/privacy"
      cookie_policy_url: "https://daostudio.in/cookies"
      data_controller: "DAO Studio Private Limited"
      data_controller_email: "privacy@daostudio.in"
      banner_text_override: ""
      gtm_container_id: "${DSPL_GTM_CONTAINER_ID}"

# Security headers for GitHub Pages (CSP via meta tags)
security_headers:
  csp_policy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net https://static.ads-twitter.com https://analytics.twitter.com https://www.linkedin.com https://snap.licdn.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: https://www.google-analytics.com https://www.facebook.com https://t.co https://analytics.twitter.com https://px.ads.linkedin.com; font-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://www.facebook.com https://analytics.twitter.com https://www.linkedin.com https://px.ads.linkedin.com; frame-src 'self' https://www.youtube.com https://calendar.google.com"
  enable_sri: true
  referrer_policy: "strict-origin-when-cross-origin"
  no_sniff: true
  frame_options: "SAMEORIGIN"

# Performance monitoring and optimization settings
