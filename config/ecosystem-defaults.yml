# Ecosystem Defaults Configuration
# These settings are inherited by all domains in the ecosystem
# Matches the comprehensive EcosystemConfig schema

# ============================================================================
# ANALYTICS CONFIGURATION
# ============================================================================
# Proto Source: config/schema/ecosystem.proto -> message Analytics
# 
# Purpose:
#   Centralized analytics configuration inherited by all domains in the ecosystem.
#   Enables unified tracking across 5 domains with cross-domain user journeys.
#   Supports multi-touch attribution for AI transformation services.
#
# Build Pipeline Integration:
#   - Phase 2: process-configs.sh merges with domain overrides
#   - Phase 2.5: validate.sh ensures configuration validity
#   - Phase 6: Gatsby consumes via GraphQL and environment variables
#   - Runtime: Components access via useConfig() hook
#
# Privacy & Consent:
#   All analytics respect user consent via Google Consent Mode v2.
#   Tracking pixels only load after explicit user consent.
#   See consent_settings section for GDPR/CCPA compliance.
# ============================================================================

analytics:
  # Google Analytics 4 - Primary analytics platform
  # Used for: User behavior, conversion tracking, audience insights
  # Implementation: gatsby-plugin-google-gtag + useGTM hook
  # Consent: Respects Google Consent Mode v2 signals
  ga_tracking_id: "${GA_TRACKING_ID}"
  
  # Meta (Facebook) Pixel - Social advertising attribution
  # Used for: Retargeting, lookalike audiences, conversion tracking
  # Implementation: Injected via gatsby-ssr.js, managed by consent system
  # Best for: B2C campaigns, social media marketing
  meta_pixel_id: "${META_PIXEL_ID}"
  
  # Cross-domain tracking - Unified journey tracking
  # Why enabled: Users often visit multiple domains in one session
  # Example journey: getHarsh.in → blog.getHarsh.in → causality.in/HENA
  # Implementation: GA4 linker + GTM cross-domain configuration
  cross_domain_tracking: true
  
  # Linked domains - Ecosystem domains for unified tracking
  # Pattern validated: Build system verifies these exist via find_all_domains()
  # Usage: GA4 automatically decorates links between these domains
  # Note: Discovered dynamically, these are defaults only
  linked_domains:
    - getHarsh.in      # Personal brand & hub
    - causality.in     # Research & analytics
    - rawThoughts.in   # Consulting & enterprise
    - sleepwalker.in   # Creative experiments
    - daostudio.in     # Collaboration platform
  
  # ============================================================================
  # TWITTER/X PIXEL - Social platform conversion tracking
  # ============================================================================
  twitter_pixel:
    # Pixel ID - Core identifier for Twitter ads account
    # Setup: Twitter Ads Manager → Conversions → Website Tag
    pixel_id: "${TWITTER_PIXEL_ID}"
    
    # Conversion tracking - Track valuable user actions
    # Enables: ROI measurement for Twitter ad campaigns
    enable_conversion_tracking: true
    
    # Universal website tag - Base tracking infrastructure
    # Required for: All Twitter pixel features to function
    enable_website_tag: true
    
    # Site tag ID - Secondary identifier for website tag
    twitter_site_tag_id: "${TWITTER_SITE_TAG_ID}"
    
    # Tracked events - User actions to measure
    # Customizable: Add/remove based on business goals
    # Implementation: Maps to Twitter's standard event taxonomy
    track_events:
      - "PageView"      # Automatic on every page
      - "Download"      # When users download resources
      - "SignUp"        # Newsletter or service signups
      - "ViewContent"   # Deep engagement metrics
    
    # Enhanced matching - Improve attribution accuracy
    # How: Securely matches hashed emails with Twitter users
    # Privacy: Data is hashed before transmission
    enable_enhanced_matching: true
    
    # Data processing restrictions - Regional compliance
    # When to enable: California residents or GDPR requirements
    # Impact: Limits certain data uses for compliance
    restricted_data_processing: false
  
  # ============================================================================
  # LINKEDIN INSIGHT TAG - Professional audience analytics
  # ============================================================================
  linkedin_insight:
    # Partner ID - LinkedIn Campaign Manager identifier
    # Best for: B2B marketing, professional services, enterprise
    # Setup: Campaign Manager → Account Assets → Insight Tag
    partner_id: "${LINKEDIN_PARTNER_ID}"
    
    # Conversion tracking - Measure professional conversions
    # Tracks: Whitepaper downloads, demo requests, consultations
    enable_conversion_tracking: true
    
    # Matched audiences - Build retargeting lists
    # Enables: Custom audiences from website visitors
    # Use case: Retarget blog readers with service offers
    enable_matched_audiences: true
    
    # Website demographics - Visitor professional insights
    # Provides: Job titles, companies, industries, seniority
    # Value: Understand if reaching target decision makers
    enable_website_demographics: true
    
    # Conversion IDs - Specific goal tracking
    # Setup: Create each conversion in Campaign Manager first
    # Strategy: Different IDs for different funnel stages
    conversion_ids:
      - "${LINKEDIN_CONVERSION_CONTACT}"   # High-intent actions
      - "${LINKEDIN_CONVERSION_DOWNLOAD}"  # Mid-funnel engagement
    
    # Enhanced conversions - First-party data attribution
    # Benefit: Better tracking in cookieless future
    # How: Uses secure, hashed first-party data
    enable_enhanced_conversion: true
    
    # Cross-domain tracking - Multi-site attribution
    # Aligns with: Overall cross_domain_tracking strategy
    # Purpose: Track LinkedIn campaigns across ecosystem
    enable_cross_domain: true

# ============================================================================
# SEO DEFAULTS CONFIGURATION
# ============================================================================
# Proto Source: config/schema/ecosystem.proto -> message SeoDefaults
#
# Purpose:
#   Default SEO and meta tag settings inherited by all domains, blogs, and projects.
#   These values control how your content appears in search results, social shares,
#   and AI/LLM systems. Every field here shapes your digital presence.
#
# Inheritance Model:
#   ALL fields can be overridden at any level using deep merge (yq merge operator):
#   ecosystem-defaults.yml → domain config.yml → blog/project config.yml
#   
#   Examples:
#   - Domain can override author to "RTEPL Team" while ecosystem has "Harsh Joshi"
#   - Blog can override description_pattern while inheriting other fields
#   - Project can set custom og_image_pattern for documentation sites
#
# Build Pipeline Flow:
#   - Phase 2: process-configs.sh merges configs using yq deep merge
#   - Phase 5.5: llms.txt generated if enable_llms_txt is true
#   - Phase 6: Gatsby injects into meta tags via SEO.tsx component
#   - Runtime: Values available through GraphQL siteMetadata
# ============================================================================

seo_defaults:
  # Default author name - Identity attribution across content
  # Impact: Shows in article bylines, meta tags, Schema.org Article author
  # SEO Value: Builds E-E-A-T (Expertise, Experience, Authority, Trust)
  # Override: Domains can set organization names, blogs can set team names
  # Example overrides: "RTEPL Team", "DAO Studio Research", "Anonymous"
  author: "Harsh Joshi"
  
  # Language and region locale - Content internationalization
  # Format: language_COUNTRY (ISO 639-1 + ISO 3166-1)
  # Impact: Controls search result display, date formats, Schema.org language
  # SEO Value: Critical for regional search rankings and user experience
  # Override: Projects might use "en_GB" for UK focus, "hi_IN" for Hindi
  locale: "en_US"
  
  # Twitter/X handle - Social identity linkage
  # Format: @username (include the @ symbol)
  # Impact: Links all shared content back to this Twitter account
  # Creates: twitter:site and twitter:creator meta tags
  # Override: Different domains can use different handles (@daostudio, @causality_in)
  # Social proof: Enables Twitter Cards with attribution
  twitter: "@getHarshOnline"
  
  # Meta description pattern - Search snippet fallback structure
  # Variables: {description} replaced with page-specific description
  # 
  # IMPORTANT: This is a FALLBACK pattern, not forced branding!
  # - Pages WITH descriptions: Pattern NOT applied, uses exact description
  # - Pages WITHOUT descriptions: Pattern applied as fallback
  # - Best practice: Keep suffix minimal or use just "{description}"
  # 
  # Domain-specific examples:
  # - getHarsh.in: "{description} | Harsh Joshi" (personal brand)
  # - causality.in: "{description}" (clean for research)
  # - rawThoughts.in: "{description} | RTEPL" (enterprise identity)
  # - daostudio.in: "{description} | DAO Studio" (org identity)
  # 
  # SEO Impact: Avoid repetitive suffixes that dilute keyword relevance
  description_pattern: "{description}"
  
  # Open Graph image URL pattern - Visual identity in shares
  # Variables: {domain} replaced with actual domain (getHarsh.in, etc.)
  # Requirements: Images should be 1200x630px at 1.91:1 aspect ratio
  # Impact: Preview image when links shared on Facebook, LinkedIn, Slack, Discord
  # Override: Each domain MUST provide own og-image.png in /assets/
  # Alternative: Articles can override with specific images per post
  # Fallback: If image missing, social platforms show text-only preview
  og_image_pattern: "https://{domain}/assets/og-image.png"
  
  # LLMs.txt generation - AI/LLM discovery optimization
  # Purpose: Creates markdown summary at /llms.txt for AI systems
  # Impact: Helps ChatGPT, Claude, Perplexity understand your site structure
  # Generation: Phase 5.5 creates from templates/discovery/llms.txt.template
  # Content: Pulls from master_posts, project docs, config metadata
  # Override: Can disable for private/internal domains
  # Note: Part of emerging GEO (Generative Engine Optimization) standards
  enable_llms_txt: true
  
  # Copyright notice pattern - Legal attribution
  # Variables: {year} = current year, {entity} = legal entity from config
  # Impact: Footer copyright, Schema.org copyrightHolder
  # Legal: Establishes ownership and publication date
  # Override: Domains set their entity: "RTEPL", "DSPL", "Personal"
  # Display: Shows in UniversalFooter.tsx component
  copyright_pattern: "© {year} {entity}. All rights reserved."

# ============================================================================
# GATSBY PLUGINS CONFIGURATION
# ============================================================================
# Proto Source: config/schema/ecosystem.proto -> repeated string gatsby_plugins
#
# IMPORTANT: This field is for documentation/validation only!
# Actual Gatsby plugins are hardcoded in src/gatsby-config.ts
#
# Why this field exists:
#   - Required by proto schema for validation
#   - Historical: Originally intended for dynamic plugin loading
#   - Current: Serves as documentation of plugin architecture
#
# Custom Tool Replacements:
#   - Sitemap: generate-sitemap.sh (Phase 5.9) replaces gatsby-plugin-sitemap
#   - RSS Feed: generate-rss.sh (Phase 5.10) replaces gatsby-plugin-feed  
#   - PWA Manifest: generate-pwa-manifest.sh (Phase 5.7) replaces gatsby-plugin-manifest
#   - Search: generate-search-index.sh replaces no plugin (custom feature)
#   - CMS Config: generate-decap-config.sh enhances gatsby-plugin-decap-cms
#
# Actual Active Plugins (see src/gatsby-config.ts):
#   - gatsby-plugin-react-helmet (SEO/meta tags)
#   - gatsby-plugin-postcss (Tailwind CSS)
#   - gatsby-plugin-google-tagmanager (Analytics)
#   - gatsby-plugin-decap-cms (CMS integration)
#   - gatsby-source-filesystem (Content sourcing)
#   - gatsby-transformer-remark (Markdown processing)
#   - gatsby-plugin-image (Image optimization)
#   - gatsby-plugin-sharp (Image processing)
#   - gatsby-transformer-sharp (Image transformation)
# ============================================================================

gatsby_plugins: []  # Empty array satisfies schema validation

# ============================================================================
# CONTENT DEFAULTS CONFIGURATION
# ============================================================================
# Proto Source: config/schema/ecosystem.proto -> message ContentDefaults
#
# Purpose:
#   Default content display settings inherited by all domains and blogs.
#   Controls how content is excerpted, paginated, and displayed to readers.
#   These values guide content presentation but may be overridden by components.
#
# Inheritance Model:
#   All fields can be overridden at domain, blog, or project level.
#   Blogs might want different pagination, projects might disable excerpts.
#
# Build Pipeline Flow:
#   - Phase 2: Merged during config processing
#   - Phase 6: Available in processed config.yml 
#   - Runtime: Could be accessed via GraphQL (if exposed in gatsby-config.ts)
#
# TODO: Wire up in components (see TODO.md)
#   These defaults are defined but NOT fully integrated in components.
#   Components currently use hardcoded values or different approaches.
#   Consider these as intended behavior to be implemented.
# ============================================================================

content_defaults:
  # Excerpt length in words - Content preview guidance
  # Intent: Suggest excerpt length for article summaries
  # Current Usage: 
  #   - SEO.tsx references article.excerpt but doesn't truncate
  #   - Search results show excerpts but length varies
  # TODO: Wire up in:
  #   - src/src/components/article/ArticleCard.tsx (truncate excerpt)
  #   - src/src/components/article/LatestArticle.tsx (excerpt display)
  #   - src/gatsby-node.js (excerpt generation during build)
  # SEO Note: Google typically shows 155-160 chars in snippets
  # Override: Blogs with longer posts might want 200-250 words
  excerpt_length: 150
  
  # Posts per page for pagination - List density preference
  # Intent: Default number of articles in blog index pages
  # Current Usage:
  #   - ArticleList.tsx mentions pagination in comments
  #   - Actual pagination may be handled differently
  # TODO: Wire up in:
  #   - src/gatsby-node.js createPages() for blog pagination
  #   - src/src/templates/blog-list.tsx (if created)
  #   - src/src/components/article/ArticleList.tsx
  # UX Balance: 10 works well for mobile, 15-20 for desktop-first
  # Override: Image-heavy blogs use 6-8, text blogs use 15-20
  posts_per_page: 10
  
  # Date format pattern - Display consistency preference
  # Format: strftime pattern (Python/Ruby style) 
  # Current Usage:
  #   - Components use JavaScript Date.toLocaleDateString()
  # TODO: Wire up in:
  #   - src/src/utils/date-formatter.ts (create utility)
  #   - src/src/components/article/ArticleHeader.tsx
  #   - src/src/components/article/ArticleList.tsx
  #   - src/src/components/search/SearchResultItem.tsx
  # Current Pattern: "%B %d, %Y" = "January 15, 2024"
  # Note: Requires strftime-to-JS translation utility
  date_format: "%B %d, %Y"
  
  # Show reading time - Reader expectation feature flag
  # Intent: Enable/disable reading time estimates
  # Current Usage:
  #   - GTMServices.getReadingTime() calculates for analytics only
  # TODO: Wire up in:
  #   - src/src/components/article/ArticleHeader.tsx (display reading time)
  #   - src/src/components/article/ArticleCard.tsx (show on cards)
  #   - src/src/hooks/useReadingTime.ts (create hook)
  # Implementation: Calculate from word count and reading_wpm
  # Override: Technical docs might disable (varies by expertise)
  show_reading_time: true
  
  # Words per minute for reading time calculation
  # Intent: Baseline for estimating reading duration
  # Current Usage:
  #   - NOT found in actual implementation
  # TODO: Wire up in:
  #   - src/src/hooks/useReadingTime.ts (create hook)
  #   - src/src/utils/reading-time.ts (create utility)
  #   - src/gatsby-node.js (calculate during build)
  # Industry Standards:
  #   - 200-250 WPM: Average adult reading
  #   - 200 WPM: Good for technical content
  #   - 150 WPM: Code-heavy documentation
  # Formula: word_count / reading_wpm = minutes
  reading_wpm: 200

# ============================================================================
# CROSS-DOMAIN NAVIGATION CONFIGURATION
# ============================================================================
# Proto Source: config/schema/ecosystem.proto -> message CrossDomainNav
#
# Purpose:
#   Central domain registry for the multi-domain ecosystem.
#   Used by CMS widgets, search federation, and discovery tools
#   to understand the ecosystem structure and enable cross-domain features.
#
# Inheritance Model:
#   Domains can override to show different subsets
#   Blogs inherit parent domain's list
#   Projects might disable for focused documentation
#
# Build Pipeline Flow:
#   - Phase 2: Config processing merges domain lists
#   - Phase 4: CMS widgets use for cross-posting options
#   - Phase 5: Search federation uses for cross-domain search
#   - Phase 5.2-5.7: Discovery files reference for ecosystem structure
#
# Actual Usage in System:
#   - CMS: CrossPostingWidget uses for domain selection
#   - Search: FederatedSearch uses for cross-domain search endpoints
#   - Discovery: ecosystem.json includes full domain list
#   - Manifests: AI agent manifests reference related domains
# ============================================================================

cross_domain_nav:
  # Enable cross-domain features throughout the ecosystem
  # Impact: Controls whether cross-domain functionality is active
  # Current Usage:
  #   - CMS: Enables cross-posting widget when true
  #   - Search: Enables federated search across domains
  #   - Discovery: Includes federation data in ecosystem.json
  # Components:
  #   - src/static/admin/widgets/cross-posting-widget.tsx (domain selection)
  #   - src/src/components/search/FederatedSearch.tsx (search federation)
  #   - config/tools/generate-federated-manifest.js (federation manifest)
  # Override: Projects might disable for documentation focus
  enabled: true
  
  # Position hint for UI elements (informational)
  # Intent: Suggest where cross-domain UI should appear
  # Options: "top", "bottom", "both", "none"
  # Current Usage:
  #   - NOT actively used by components (informational only)
  #   - Could guide future TopNavigation.tsx implementation
  # TODO: Implement in TopNavigation.tsx for domain switcher
  position: "top"
  
  # Master list of ecosystem domains
  # Critical: This is the SOURCE OF TRUTH for the ecosystem structure
  # Current Usage:
  #   - CMS: generate-decap-config.js uses for cross-posting options
  #   - Search: generate-federated-manifest.js uses for federation
  #   - Discovery: All discovery tools reference this list
  #   - Pattern validation: Should match find_all_domains() results
  # Data Flow:
  #   1. Listed here in ecosystem-defaults.yml
  #   2. Processed by process-configs.sh
  #   3. Used by generate-decap-config.js for CMS dropdowns
  #   4. Referenced by search federation for cross-domain queries
  #   5. Included in ecosystem.json for AI/external consumers
  # Order: Matters for UI display (most important first)
  domains:
    - getHarsh.in      # Personal hub - primary entry point
    - causality.in     # Research domain - RTEPL owned
    - rawThoughts.in   # Consulting domain - enterprise focus
    - sleepwalker.in   # Creative domain - experimental
    - daostudio.in     # Collaboration - DSPL owned

environment_vars:
  GA_TRACKING_ID:
    description: "Google Analytics tracking ID"
    required: true
    example: "GA-123456789"
    security_level: "SENSITIVE"
    redaction_strategy: "PARTIAL"
  GTM_CONTAINER_ID:
    description: "Google Tag Manager container ID"
    required: true
    example: "GTM-XXXXXXX"
    security_level: "SENSITIVE"
    redaction_strategy: "PARTIAL"
  META_PIXEL_ID:
    description: "Meta/Facebook Pixel ID"
    required: true
    example: "1234567890123456"
    security_level: "SENSITIVE"
    redaction_strategy: "PARTIAL"
  TWITTER_PIXEL_ID:
    description: "Twitter/X Pixel ID"
    required: false
    example: "o12345"
    security_level: "SENSITIVE"
    redaction_strategy: "PARTIAL"
  TWITTER_SITE_TAG_ID:
    description: "Twitter/X Site Tag ID"
    required: false
    example: "tw-xxxxx-xxxxx"
    security_level: "SENSITIVE"
    redaction_strategy: "PARTIAL"
  LINKEDIN_PARTNER_ID:
    description: "LinkedIn Partner ID for Insight Tag"
    required: false
    example: "1234567"
    security_level: "SENSITIVE"
    redaction_strategy: "PARTIAL"
  RTEPL_GTM_CONTAINER_ID:
    description: "GTM container ID for RTEPL entity"
    required: true
    example: "GTM-XXXXXXX"
    security_level: "SENSITIVE"
    redaction_strategy: "PARTIAL"
  DSPL_GTM_CONTAINER_ID:
    description: "GTM container ID for DSPL entity"
    required: true
    example: "GTM-YYYYYYY"
    security_level: "SENSITIVE"
    redaction_strategy: "PARTIAL"

