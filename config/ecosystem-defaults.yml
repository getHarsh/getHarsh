# Schema.org configuration for semantic trace extraction
schema_org_config:
  enabled: true
  mapping_mode: "hybrid"  # automatic with manual overrides
  include_all_mappings: true
  included_mappings: []  # Empty means include all
  custom_mappings:
    PersonRole: "schema:Role"
    ProjectType: "schema:CreativeWork"
    ProjectLifecycle: "schema:CreativeWorkStatus"
    DependencyType: "schema:hasPart"
    EntityType: "schema:Thing"
    AffiliationType: "schema:affiliation"
  validation:
    validate_types: true
    validate_required: true
    allow_custom_properties: true
    strict_mode: false  # Allow flexibility during 3.14% phase

# Global Schema.org settings for JSON-LD generation
schema_org_settings:
  default_context: "https://schema.org"
  include_ids: true
  base_url: "https://{domain}"  # Dynamically replaced per domain
  default_language: "en"
  include_breadcrumbs: true
  rich_snippets:
    enabled: true
    snippet_types:
      - "Article"
      - "BlogPosting" 
      - "Person"
      - "Organization"
      - "ResearchProject"
      - "SoftwareApplication"
      - "CreativeWork"
      - "WebSite"
      - "WebPage"
    include_images: true
    include_ratings: false  # No rating system yet

